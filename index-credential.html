er-aided manufacturing files. The organisation's data flow diagram for OT has included the expected operational flow of data in the OT environment, including: –data flow crossing network boundaries, indicating communication channels between logical and/or physical segments; and –instances of data flow through insecure protocols.","ai":"The organisation has established and implemented classification and handling policies and procedures for employees to identify the data sets in the organisation that could be used in both internal and external AI tools and/or services, e.g. generative AI. The organisation’s data flow diagram for AI has included documentation of data associated with its AI system(s), e.g.: –data used for training AI system(s) (where relevant); –data input to AI system(s); including prompts, and –data output from AI system(s). The organisation has implemented secure handling of: –data input to AI systems; –data models (where relevant); and –data output from AI systems. Examples of secure handling of data input to AI systems include measures for: –data integrity; –data provenance; –data validation and/or sanitisation; and –protection on the query interface to detect and mitigate attempts to access, modify and exfiltrate data, e.g. guardrails, rate limiting of queries. Examples of secure handling of AI models include measures for: –verification of models with hashes/ signatures; and –security evaluation of the AI systems before deployment, e.g. benchmarking, security testing, red teaming. Examples of secure handling of data output from AI systems include measures for: –verification of integrity of data output; and –generating output that is usable to users whilst not revealing unnecessary information to potential attackers."},"Performer":{"classical":"The organisation has established and implemented data management policies and procedures through the guidelines, requirements and steps to handle business- critical data (including personal data, company secrets, intellectual property) at rest, in transit and in use, securely. The organisation has defined and allocated roles and responsibilities to ensure that it is clear who is responsible to maintain, support and manage the data assets in the inventory list.","cloud":"The organisation’s data management policies and procedures has taken into consideration: –the ability to maintain oversight of where data in the cloud is stored, processed, and backed up to ensure it is in line with organisation’s obligations; and –The ability to manage migration of data securely between cloud environments for interoperability and portability.","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation uses encryption to protect its data and has established and implemented cryptographic policies and processes to ensure that the keys are being handled securely throughout the cryptography key management lifecycle. The organisation has established and implemented policies and procedures allowing only authorised devices with secure protocols to communicate, store and transfer business-critical data (including personal data, company secrets, intellectual property) within the organisation. The organisation has established and implemented policies and procedures to report on data protection and privacy risks and initiatives to the Board and/or senior management to ensure that they are kept informed.","cloud":"The organisation has incorporated best practices for cryptography into its policies and processes. Examples include: –secure storage and use of API keys, secrets, passwords, secure shell (SSH)keys, or certificates, e.g., secure procedure for key lifecycle from generation to revocation; and –regular scanning to search for static credentials and keys/secrets stored in cleartexts. The organisation has also considered different approaches for management of encryption keys to balance between maintaining control over the keys and leveraging a fully managed cloud service: –encryption keys managed by the CSP; –customer-managed encryption keys; and –customer-supplied encryption keys (or \"bring your own key\"). Examples include Data Security Posture Management (DSPM) solutions or equivalents to protect sensitive data and support compliance with data protection regulations within cloud environments.","ot":"In situations where the OT environment uses authorised devices that support insecure protocol(s), the organisation has established and implemented reasonable compensating controls.","ai":"For sensitive data, the organisation has considered the use of privacy-preserving techniques, e.g., anonymisation, differential privacy (where applicable) for data protection."}},"essentialsRef":["A.3"]},{"id":10,"name":"Backups","group":"Information asset protection","desc":"This domain ensures that information assets are regularly backed up in a secure and consistent manner so that the organisatio systems and data in the event of a cybersecurity and/or breach of data incident.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.8 Backup: Back up essential data\" to ensure that the organisation's essential data is backed up and stored securely.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.8 Backup: Back up essential data\" to ensure that the organisation's essential data is backed up and stored securely. The organisation has established and implemented automated backup processes to ensure that the backup tasks are carried out without fail and without the need for human intervention.","cloud":"In its automated backup process, the organisation has included backups of its cloud services.","ot":"In situations where automated backup is not appropriate or recommended, e.g., has a negative impact on OT operations or safety, the organisation has established and implemented regular scheduled backups to be performed manually.","ai":"#"},"Promoter":{"classical":"The organisation has established and implemented backup plan(s) on the types, frequency and storage of backups to ensure that there is clarity of the steps to be taken to backup business-critical data in the organisation. The organisation has established and implemented the use of technology solutions for data backup and recovery, and the solutions implemented are appropriate and recognised in the industry to ensure that it can carry out reliable data backup and restoration.","cloud":"#","ot":"For OT, as the priority is on safety and availability, the organisation has considered the use of immutable storage for critical OT data, which may include programs or device configurations, as such storage provides: –additional data integrity through data storage in a read-only format; and –added protection against the installation of new software when used as a read-only drive in a maintenance workstation.","ai":"#"},"Performer":{"classical":"The organisation has established and implemented backup and recovery policies and procedures on the requirements, guidelines and detailed steps to ensure that there is consistent guidance and direction for performing backup and recovery in the organisation. The organisation has defined and allocated roles and responsibilities to ensure that it is clear who is responsible and accountable to perform and manage backups from creation to destruction.","cloud":"The organisation has implemented the appropriate backup and recovery policies and procedures based on the cloud shared responsibility model with its CSP. In situations where the CSP is responsible, the organisation has reviewed the backup and recovery practices of its CSPs to ensure the implementation is in alignment with its organisational policies.","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented a backup control sheet for the backup data storage media with the purpose of including backup, time of backup, data encryption, retention date and the employee(s) assigned the task of backup to ensure that all the key information are documented. The organisation has established and implemented policies and procedures to report backup-related matters to the cybersecurity committees/forums to ensure that senior management is kept informed. The organisation has established and implemented policies and procedures to perform reviews on the backup status regularly to ensure that failed backup jobs are addressed and remediated.","cloud":"#","ot":"#","ai":"#"}},"essentialsRef":["A.8"]},{"id":11,"name":"Bring your own device (BYOD)","group":"Information asset protection","desc":"This domain ensures that the use of personal devices is managed securely when connected to the organisation’s network. This d processes to prevent the disclosure and loss of the organisation’s business-critical data through personal devices.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has established and implemented policies and procedures to segregate personal and work- related data in the organisation within BYOD to prevent disclosure and loss of confidential and/or sensitive data.","cloud":"#","ot":"#","ai":"#"},"Performer":{"classical":"The organisation has established and implemented policies and procedures on the guidelines, requirements and steps on the use of BYOD connecting to the organisation’s network and accessing the organisation’s data to ensure that they conform to the set of security standards, e.g., passcode enabled. The organisation has implemented regular review on the use of BYOD accessing business-critical data at least annually to ensure that the devices are compliant and safe.","cloud":"#","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented cybersecurity measures within BYOD to manage and enforce organisational security protection, such as through the use of mobile device management (MDM).","cloud":"#","ot":"#","ai":"#"}}},{"id":12,"name":"System security","group":"Information asset protection","desc":"This domain ensures that cybersecurity measures and safeguards are implemented and maintained to secure the organisation’s systems and safeguards include secure configuration, logging, updates and patching.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.6 Secure/Protect: Secure configuration\" and \"A.7 Update: Software updates\" to ensure that the hardware and software use secure and updated settings.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.6 Secure/Protect: Secure configuration\" and \"A.7 Update: Software updates\" to ensure that the hardware and software use secure and updated settings. The organisation has performed monitoring on updates and patches installed to ensure that any impact or adverse effects can be identified and rectified promptly.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has defined and applied a process to ensure secure configurations are applied across all systems, servers, operating systems and network devices. The organisation has defined and applied a log management process to store and classify the different types of logs securely to ensure that they can be used to troubleshoot effectively. The organisation has defined and applied a patch management process to test and install the updates and patches securely to ensure that there are no adverse effects.","cloud":"#","ot":"As OT devices may have limited disk space and memory, the organisation has implemented: –adequate local or remote storage to reduce the likelihood of exceeding device capacity and loss of logging capability; or –mechanisms tosecurely transfer and store logs from the OT devices to alternate storage. The patch management process has taken into consideration the different availability requirements that OT sub-systems and/or network segments may have, and their corresponding differences in abilities to support patching, and the organisation has tracked the key vulnerabilities that need to be addressed.","ai":"As part of secure configuration, the organisation has considered AI model complexity and the appropriateness of the model for the intended use case, as complex models may involve additional software packages or libraries, which expand the attack surface."},"Performer":{"classical":"The organisation has defined and allocated the roles and responsibilities to oversee, manage and monitor the organisation's system security (i.e., secure configuration, logging, update and patching) to ensure that employees are clear on the tasks assigned to them. The organisation has established and implemented policies and procedures on the security configuration requirements, guidelines and detailed steps to ensure that they are aligned with the security standards. The organisation has established and implemented a secure logging policy and procedure with the requirements, guidelines and detailed steps to store, retain and delete the logs from unauthorised access. The organisation has established and implemented policies and procedures with the requirements, guidelines and detailed steps to perform and install patches/updates to ensure that the system(s) is/are patched or updated within the defined timeframes according to their priority.","cloud":"The organisation’s policies and procedures on secure configuration for cloud workloads have incorporated best practices. Examples for IaaS or PaaS users include: –images for containers or virtual machines: ▪use of images from trusted sources only; ▪use of automated, centrally managed, versioned and immutable base images for deployment; ▪verification of image integrity to detect unauthorised modifications, keeping images up-to-date with the most recent security patches; –virtual machine security: ▪use of configuration management or Infrastructure as Code (IaC) to mitigate configuration drift; ▪hardening of configuration on virtual machine instances; and –container orchestration security: hardening of orchestration services. This includes a secure logging policy and procedure for the organisation’s cloud workloads. Examples for IaaS and PaaS users include logging of: –containers or virtual machines for unusual behaviour; and –user interactions. The organisation has implemented the appropriate patch management policies and procedures based on the cloud shared responsibility model with its CSP. In situations where the CSP is responsible, the organisation has reviewed the patch management practices of its CSPs, to ensure the implementation is in alignment with its organisational policies.","ot":"#","ai":"The organisation’s policies and procedures on secure configuration for AI have incorporated best practices. Examples include: –model hardening, e.g., through adversarial training; –prompt engineering best practices including use of guardrails; –monitoring and limiting the rate of queries to AI systems; or –use of ensembles of models for better resilience against attacks."},"Advocate":{"classical":"The organisation has implemented a configuration management tool/solution that is appropriate and recognised in the industry to ensure that the system's configurations are maintained in a desired and consistent state. The organisation has established and implemented policies and procedures to ensure that the system's configuration requirements are aligned with the industry benchmarks and standards. NOTE –An organisation that offers system configuration benchmarks is the Center for Internet Security (CIS). The organisation has established and implemented policies and procedures to ensure that the systems’ configurations are being complied and the risks as a result of non-compliance are being addressed.","cloud":"The organisation has implemented solutions such as cloud-native tools for cloud configuration management, e.g. cloud security posture management (CSPM) solution, cloud-native application protection platform (CNAPP) or equivalent, to support configuration management of cloud workloads.","ot":"The organisation has implemented configuration management tool/solutions that can manage OT configuration information, where feasible. For specialised OT systems, the organisation has obtained these configuration requirements from its OT vendors and/or service providers.","ai":"#"}},"essentialsRef":["A.6","A.7"]},{"id":13,"name":"Virus and malware protection","group":"Information asset protection","desc":"This domain ensures that protection measures and technologies are implemented, maintained, and updated to continuously monito malware, which may disrupt or damage the network. This domain also addresses the processes implemented to mana further damage and spread to the network and environment is prevented.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.4 Secure/Protect: Virus and malware protection\" to ensure that there is security protection against malicious software such as virus.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.4 Secure/Protect: Virus and malware protection\" to ensure that there is security protection against malicious software such as virus. The organisation has established and implemented the use of virus and malware protection solution(s) that is/are appropriate and recognised in the industry with features such as real-time malware detection and email protection e.g., DMARC, to ensure that it/they can protect the organisation adequately. The organisation has established and implemented web filtering to protect the organisationfrom malicious websites. The organisation has defined and applied the process to isolate and contain the virus and/or malware upon confirmation of attack to ensure minimal spread and damage caused.","cloud":"The organisation has implemented the appropriate virus and malware protection based on the cloud shared responsibility model with its CSP. In situations where the CSP is responsible, the organisation has reviewed the virus and malware protection practices of its CSPs, to ensure the implementation is in alignment with its organisational policies. The organisation has developed a process for the removal of malware that has been detected in the organisation’s cloud environment, in accordance with applicable contractual agreements with its CSPs and its own organisational policies.","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has defined and applied the process to run codes or applications of unknown origin within an isolated testing environment to test for the presence of virus and/or malware prior to their use in the working environment.","cloud":"#","ot":"The organisation has implemented processes such that codes or applications of unknown origin are not implemented in the OT environment. In situations where new updates are released by authorised vendors, and the organisation does not have redundant or spare equipment or systems to support such testing, the organisation has made arrangements to conduct such testing within the vendor's test environment, or performed testing on its own setup during scheduled maintenance windows or downtime.","ai":"#"},"Performer":{"classical":"The organisation has defined and allocated the roles and responsibilities for employees to oversee, manage and maintain the virus and malware protection solution(s) to ensure clarity for the relevant employees of their required tasks.","cloud":"#","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented policies and processes to subscribe to threat intelligence from external parties and to share and verify information relating to cyberattacks, which includes virus and/or malware attacks. The organisation has established and implemented policies and processes to review and report findings on virus and/or malware to the Board and/or senior management to ensure that they are kept informed. The organisation has established and implemented scanning and detection of indicators of compromise to ensure early identification of anomalies and suspicious activities.","cloud":"The organisation has established and implemented policies and processes to maintain visibility of cloud- specific threats, including adversaries targeting the cloud-based environment, e.g., subscribing to threat intelligence which include cloud-based threats, participation in cloud-related special interest groups or equivalent, to receive early warnings and advice regarding new threats and vulnerabilities.","ot":"The organisation has established and implemented policies and processes to maintain visibility of OT- specific threats, e.g., subscribing to OT-specific threat intelligence, including thattailored for its own or adjacent sectors, participating in OT-specific special interest groups or equivalent, to receive early warnings and advice regarding new threats and vulnerabilities.","ai":"The organisation has established and implemented policies and processes to maintain visibility of AI-specific threats, including adversaries targeting AI, e.g., subscribing to threat intelligence which include AI-specific threats, participation in AI-related special interest groups or equivalent, to receive early warnings and advice regarding new threats and vulnerabilities."}},"essentialsRef":["A.4"]},{"id":14,"name":"Secure Software Development Life Cycle (SDLC)","group":"Information asset protection","desc":"This domain ensures that security specifications and practices are incorporated into the system’s SDLC so that the software c and consistent manner.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has established and implemented security guidelines and requirements in its system and/or application development. Examples include: –secure coding; –secure management of API keys; –reviewing the security posture of third-party software, including open source;and –adhering to best practices and/or standards to ensure that it adheres to the security principles. NOTE –In Singapore, the Safe App Standard provides guidance on implementing essential security controls and best practicesfor mobile app development.","cloud":"Examples include: –securing APIs used for accessing and configuring cloud resources and data (e.g., implementing authentication and authorisation), as APIs exposed on public-facing assets in the cloud increase the attack surface and are priority targets for malicious actors; –securing the information being transferred between the API and the applications that interface with it using encryption and/or security protocols; –performing input verification of data being relayed to an API as a safeguard against attacks such as structured query language (SQL)injection, cross-site scripting (XSS), potential execution of remote code; –deploying a web application firewall to block malicious API requests; –implementing rate limiting to restrict the number of API requests within a specified period to prevent brute-force attacks and other malicious behaviour; –enabling logging and monitoring on API traffic to identify anomalies or possible security threats; and –using DevSecOps to automate core security tasks by embedding security checks, scans, and tests into the continuous integration and continuous delivery (CI/CD) workflow to facilitate rapid and secure delivery of code changes.","ot":"#","ai":"These security guidelines and requirements have been established and implemented across the life cycle of the organisation’s AI systems, i.e.: –design; –development; –deployment; and –operations and maintenance."},"Performer":{"classical":"The organisation has established and implemented an SDLC framework with cybersecurity measures and requirements to manage the software development life cycle ensuring that areas such as data integrity, authentication, authorisation, accountability and exception handling can be addressed.","cloud":"The organisation has implemented relevant SDLC frameworks for cloud, e.g.: –secure design and architecture; –secure coding –continuous build, integration, and testing; –continuous delivery and deployment; and –runtime defence and monitoring.","ot":"The organisation has implemented relevant SDLC frameworks for OT, e.g.: –security management; –specification of security requirements; –security by design; –secure implementation; –secure requirements testing; –security update management; and –security guidelines.","ai":"The organisation has implemented relevant SDLC frameworks for AI, e.g.: –secure design; –secure development; –secure deployment; and –secure operations and maintenance."},"Advocate":{"classical":"The organisation has established and implemented the change management policy and process to ensure that changes or deployments to the production environment are reviewed and tested securely, with a rollback plan in place to ensure that the change is controlled. The organisation has established and implemented a policy and process to perform security testing on the system and/or application before deployment to identify security weaknesses and vulnerabilities.","cloud":"#","ot":"#","ai":"This has included security testing on the organisation's AI system(s), e.g., adversarial testing."}}},{"id":15,"name":"Access control","group":"Secure access & environment","desc":"This domain ensures that sufficient access management controls and formalised processes are in place so that the access to th data by employees, contractors and third parties are granted only on a least privilege basis and managed in a controlled and consiste","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.5 Secure/Protect: Access control\" to ensure that there are cybersecurity measures in place over who has access to the data and assets.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.5 Secure/Protect: Access control\" to ensure that there are cybersecurity measures in place over who has access to the data and assets. The organisation performs regular role matrix review at least on an annual basis on the systems to ensure that the roles commensurate with the activities the employee, contractor and/or third party is allowed to perform.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has defined and implemented a process to approve and follow up on account access and role matrix reviews to ensure that unauthorised entry is rectified and signed off. The organisation has defined and applied a process to ensure that employees are assigned roles based on the principle of least privilege and segregation of duties. The organisation has established and implemented a secure log-on policy and procedure outlining the requirements, guidelines and detailed steps for gaining access to sensitive and/or business-critical data, as well as privileged access to ensure that the access is controlled and restricted.","cloud":"In addition to roles for employees, for organisations using IaaS or PaaS, the organisation has also implemented the principle of least privilege for cloud workloads by granting them the minimum permissions necessary to perform their assigned tasks and reviewing the permissions of the workloads to ensure that they do not have excessive permissions. Examples of a secure log-on policy and procedure include: –implementing protection of its cloud management plane (e.g. CSP console) access and activity; –implementing measures to enable the organisation to scale the management of users and identities for cloud computing, e.g., identity federation; –implementing authorisation measures that allow more granular control, e.g., use of attribute-based access control (ABAC) or policy- based access control (PBAC) to complement role-based access control (RBAC), where access is granted to all users with a given role, where available and feasible; –eliminating the use of static cloud credentials such as hard-coded API keys where feasible; and –using temporary access tokens instead of permanent/static credentials/permissions for data sharing with external parties.","ot":"The organisation has implemented separate authentication mechanisms and/or credentials for employees that have access to both OT and IT (or corporate) networks to mitigate against lateral movement between corporate IT networks and the OT environment in theevent that employee credentials are compromised. For OT, as the priority is on safety and availability, the organisation has taken into consideration how any potential delay associated with the secure logon policy and procedures has not impeded access of OT personnel in emergency situations.","ai":"#"},"Performer":{"classical":"The organisation has established and implemented a passphrase policy and procedure outlining the requirements, guidelines and detailed steps on setting and updating passphrases to provide guidance and direction on what constitutes strong passphrases. The organisation has established and implemented a user access control policy and procedure outlining the requirements, guidelines and detailed steps to restrict and authorise users’ access to its assets. The organisation has established and implemented secure remote access policies and procedures outlining the requirements, guidelines and detailed steps to protect information accessed remotely.","cloud":"#","ot":"The policy and procedure have outlined the respective limitations and the corresponding compensating controls for OT assets where: –default passwords cannot be changed; –secure passwords or passphrases are not supported; –passwords or passphrases are transmitted in cleartext due to legacy protocols; –passwords are not recommended; or –other limitations or constraints exist.","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented policies and processes to review any signs of access compromise and to report the results to the Board and/or senior management to ensure that they are kept informed. The organisation has established and implemented a privileged access solution that is appropriate and recognised in the industry to authenticate users and authorise access based on their roles to ensure that there is a more efficient and effective way of managing access.","cloud":"To implement privileged access for the cloud environment, the organisation has implemented measures to scale the management of cloud identities and their entitlements to mitigate the risk of unauthorised access and data breaches, e.g., using identity providers to authenticate users through SSO, use of cloud identity and entitlement management (CIEM) solutions, cloud- based identity and access management (IAM), CNAPP, or equivalent.","ot":"The organisation has implemented separate deployments of privileged access solutions to manage privileged access for the OT and IT environment respectively, to mitigate against lateral movement between corporate IT networks and the OT environment, should privileged access credentials be compromised.","ai":"#"}},"essentialsRef":["A.5"]},{"id":16,"name":"Cyber threat management","group":"Secure access & environment","desc":"This domain ensures that the organisation actively identifies threats and security anomalies within their operating environme devices and employees, so that early detection and response activities can be carried out.","essentials":false,"entryTier":"Performer","applicable":["Performer","Advocate"],"req":{"Performer":{"classical":"The organisation has established and implemented a log monitoring policy, process and procedure outlining the requirements, guidelines and detailed steps for monitoring security logs for threats and abnormalities. The organisation has defined and assigned roles and responsibilities to carry out log monitoring and reviews of its systems, investigate incidents and report to relevant stakeholders. The organisation has implemented security information and event management (SIEM) to store logs centrally for correlation and to ensure more effective log monitoring. The organisation has established and implemented a security baseline profile on its systems to analyse and perform monitoring to ensure that anomalies are identified. The organisation has established and implemented policies and procedures on the requirements, guidelines and detailed steps to be carriedout when itdetectsabnormal or suspicious logs, to ensure that they are investigated, reported and remediated promptly.","cloud":"The organisation has incorporated cloud best practices for its log monitoring policy, process and procedure. Examples include: –verifying that CSPs provide adequate logging capabilities, e.g., access to logs, retention period of logs, to ensure alignment with organisational policies; –prioritising logs for cloud workloads that may be most indicative of security issues, such as logs from the management plane, identity and access management activity, or changes in public-facing resources; –automating log retrieval from CSPs; –normalising cloud logs to a common format across cloud applications to facilitate log analysis; and –normalising event, audit, activity, and other log entries that include user information (such as usernames) to a corporate identity so that events that refer to the same person in different usernames/user accounts in different cloud applications can be correlated. The organisation's SIEM implementation has the capability to manage logs for the organisation's cloud workloads.","ot":"The organisation has assigned roles and responsibilities to monitor and review logs, and investigate and report incidents for both OT and IT as OT and IT security operations converge, and OT and IT teams may be distinct and operate independently. In situations where active scanning by the SIEM solution is not appropriate or recommended in the OT environment, the organisation has: –implemented passive scanning; or –performed active scans during scheduled maintenance windows or downtime. Recognising that the OT environment has a deterministic nature and OT activitiesand traffic tend to be more predictable and repeatable, the organisation has established a baseline of normal network traffic and data flows that factors in normal human and OT process behaviour, to differentiate between normal or transient conditions and anomalies and minimise false positive alerts. For OT, because the priority is safety and availability, the organisation's policies and procedures have indicated its response priority, e.g., restoring OT operations to normal versus performing investigation and preserving forensic data.","ai":"The log monitoring policy, process and procedure have included: –monitoring inputs to the AI models or AI systems for possible attacks and suspicious activity; and –monitoring AI model or system outputs and performance."},"Advocate":{"classical":"The organisation has established and implemented advanced analytics processes and solutions that are appropriate and recognised in the industry to detect abnormal system and user behaviour, e.g., user behaviour analytics. The organisation has established and implemented reporting requirements and dashboards to report detected cybersecurity incidents or anomalies based on their severity to the Board and/or senior management. The organisation has established and implemented measures and processes to proactively search for threats that are hidden in its IT environment.","cloud":"This includes threat hunting in the organisation's cloud environment.","ot":"This includes threat hunting for hidden threats targeting the OT environment, the organisation’s own sector or adjacent sectors.","ai":"This includes measures such as performing red teaming on the organisation’s AI systems."}}},{"id":17,"name":"Third-party risk and oversight","group":"Secure access & environment","desc":"This domain ensures that sufficient cybersecurity measures and/or processes are established to manage thirdparty risks so that the organisation can minimise and control the risks caused by services provided by third-party service providers.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has established and implemented service-level agreements with its third parties to ensure that the third party meets the commitments and expectations on cybersecurity while providing services.","cloud":"The service level agreement with the organisation’s CSPs has incorporated key areas related to cloud security. Examples include: –performance metrics of cloud services and resources, e.g., availability; –information security requirements (including shared cloud responsibility model); –change management process, e.g.; software updates; –logging and monitoring practices, e.g., log and data retention period; –incident management and communications procedures, e.g., support hours, maximum first support response time; –attainment of cloud security standards; and –data privacy.","ot":"#","ai":"The service level agreement with the organisation’s AI suppliers has incorporated key areas related to AI security. Examples include: –performance metrics of AI services, e.g. availability; –information security requirements, including responsibility of supplier for security; –guardrails and other measures implemented for security; –change management process, e.g., software updates; –logging and monitoring practices; –incident management practices; and –use of the organisation’s data for training of the supplier’s AI models."},"Performer":{"classical":"The organisation has established and implemented measures to ensure that minimum cybersecurity requirements are defined for third parties, and that third parties are informed of their security obligations and to ensure that security is established for systems and data. The organisation has established and implemented measures to assess its third parties before engaging them or onboarding them to ensure that they meet all required security obligations based on the risks for the type of services provided.","cloud":"This has included establishing a shared responsibility model with the organisation’s CSPs (and data centre service providers, where relevant), including a review of the following practices: –Notification to the organisation within a specific timeframeif the CSP identifies a vulnerability for which the organisation can apply compensating controls to reduce its severity or likelihood of exploitation; and –Support from the CSP for resolving or mitigating vulnerabilities in the CSP’s services. This has included an assessment of the minimum cybersecurity requirements to be met by: –its CSPs; and –third-party software and images used by the organisation in the cloud, including opensource, based on the risk level of the project.","ot":"This has included reviewing the practices of the organisation’s third parties for OT in situations where there is heavy reliance on the OT supply chain, e.g., OT vendors: –cybersecurity posture of third parties' products, services and/or systems; and –cybersecurity practices of third parties when supporting the organisation in providing software upgrades and patches, performing integration services, or supporting the operations and maintenance of OT systems. This has included an assessment of the minimum cybersecurity requirements to be met by its third parties, based on the risk level of the project.","ai":"This has included establishing a security shared responsibility model for AI with the organisation’s AI providers, where feasible, to cover: –the security areas for which the organisation is responsible, including its responsibility to meet its customers' expectations and needs; and –the security areas for which its suppliers and/or third-party partners are responsible. This has included an assessment of the minimum cybersecurity requirements to be met by its third parties based on the risk level of the project –For external model providers: Due diligence evaluation of the provider's own security posture. –For external software libraries, including open source: Due diligence evaluation of the libraries, e.g., AI code checking, vulnerability scanning, or checking against a database with vulnerability information. –For external APIs: Implementation of controls on data that is sent to services outside of the organisation, e.g., requiring users to log in to confirm before sending potentially sensitive information. Where there is use of models or code that is not from trusted sources, the organisation has implemented appropriate controls, e.g. sandboxing."},"Advocate":{"classical":"The organisation has established and implemented measures to assess their third parties regularly based on agreed-upon security obligations for systems security and data protection. The organisation has established and implemented measures to ensure that third- party cybersecurity risk management practices, such as assessments performed and open risks from third parties engaged, are reported to the Board and/or senior management to keep them informed.","cloud":"#","ot":"#","ai":"#"}}},{"id":18,"name":"Vulnerability assessment","group":"Secure access & environment","desc":"This domain ensures that vulnerability assessment and management are established to keep the organisation’s network and systems saknown exploitation. This domain also ensures processes are established to identify, evaluate, mitigate, and report on security vuln software.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has established a vulnerability assessment plan with objectives, scope and requirements to review and perform vulnerability assessments on its systems. The organisation performs regular vulnerability assessments, at least annually, to conduct non-intrusive scans on its systems to ensure that vulnerabilities are discovered.","cloud":"The vulnerability assessment plan has included the organisation's cloud environment. The vulnerability assessment has included the organisation's cloud environment. Examples include the following: –Images: Building vulnerability assessment agents into images. –Virtual machines: Performing runtime vulnerability assessment/scans by taking snapshots of virtual machines and assessing them offline, without affecting the running workload.","ot":"The vulnerability assessment plan has included identification and evaluation of the threats and vulnerabilities within each OT sub-system and/or network segment and/or zone. When conducting vulnerability assessments, where active scanning could interfere with real-time OT operation, the organisation has considered passive scanning and monitoring tools that are not intrusive to OT systems. If active scanning is performed, the organisation has included, in its vulnerability assessment plan, a process for testing to be conducted first, and to perform such scans during scheduled maintenance windows or downtime.","ai":"The vulnerability assessment has included the organisation's AI systems."},"Performer":{"classical":"The organisation has defined and allocated roles and responsibilities for its employees on carrying out cybersecurity vulnerability assessment and management. The organisation has established and implemented policies and procedures outlining the requirements, guidelines and detailed steps for conducting cybersecurity vulnerability assessments across its systems to ensure that steps are taken to address the associated risk vulnerabilities identified promptly. The organisation has established and implemented measures and processes to track, review, evaluate and address the vulnerabilities uncovered as part of the assessments to ensure that the vulnerabilities are remediated according to their severity.","cloud":"The vulnerability assessment policy and procedure have included the organisation's cloud environment. The organisation has verified that the vulnerability assessment policy and procedure is in alignment to the CSP’s support policy for vulnerability assessment.","ot":"In situations where vulnerabilities cannot be mitigated promptly(e.g., legacy OT devices or systems where software patches are not available, the organisation has implemented compensating controls to address these vulnerabilities.","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented a penetration test plan with the objectives, scope and rules of engagement to ensure that the penetration test can be performed safely. The organisation performs regular penetration tests, at least annually, to discover and exploit security weaknesses in its systems to ensure that its system's security can be evaluated. The organisation has established and implemented metrics and thresholds, including dashboards, to provide reporting and tracking of open, overdue and severe vulnerabilities noted within its systems to provide visibility on tracking and remediations within established timelines. The organisation has established and implemented practices and measures to regularly report on the vulnerability assessment results and findings to the Board and/or senior management.","cloud":"The penetration test plan has included the organisation's cloud environment. The organisation has verified that the penetration test plan is in alignment to the CSP’s support policy for penetration testing.","ot":"The organisation's test plan for penetration testing for the OT environment has: –implemented measures to ensure that OT functions are not adversely impacted by the testing process as OT systems can be highly sensitive to timing constraints or operate with limited resources; –factored in the use of compensating controls, such as employing a replicated, virtualised, or simulated system to conduct penetration testing where relevant; and –factored in the need to take production OT offline, during scheduled maintenance windows or downtime, before testing can be conducted where relevant.","ai":"#"}}},{"id":19,"name":"Physical/environmental security","group":"Secure access & environment","desc":"This domain ensures that physical/environmental security measures are established to protect people, property, and physical assets ensures a process is implemented to monitor and report physical/environmental risks and controls.","essentials":false,"entryTier":"Practitioner","applicable":["Practitioner","Promoter","Performer","Advocate"],"req":{"Practitioner":{"classical":"The organisation has identified the physical/environmental risks in its environment and implemented detective measures to be alerted to threats to ensure that they are addressed promptly. The organisation has taken measures to protect its physical assets against internal and external threats, e.g., using cable locks to prevent theft or tampering. The organisation has implemented physical security measures on its perimeters, e.g., fences and gates, to deter unauthorised access to the premises.","cloud":"The organisation has verified that the physical security measures implemented by its CSPs, e.g., providers' statements on physical security controls, including their data centres, certification(s) of recognised and appropriate standards that cover physical security, are in alignment with its requirements.","ot":"Examples include: –physical access of unauthorised personnel to the OT environment; and –natural disasters or power outages that disrupt the organisation’s cybersecurity practices, rendering its OT environment vulnerable to cybersecurity incidents. As logical and/or physical segmentation is used to characterise or isolate OT assets based on their risk or criticality levels or security requirements, the organisation has implemented physical controls for isolating OT sub- systems and/or network segments, e.g., use of locked cabinets or rooms to house OT assets.","ai":"#"},"Promoter":{"classical":"The organisation has defined and implemented a process to ensure that visitors are registered and authorised before accessing the premises. The organisation has defined and implemented a process to monitor its premises 24/7, e.g., using CCTV, to deter and investigate physical/ environmental threats. The organisation has defined and applied a process to store and transport physical media containing business-critical data securely within and outside its premises to ensure that confidential and/or sensitive data are protected.","cloud":"#","ot":"#","ai":"#"},"Performer":{"classical":"The organisation has established and implemented policies and procedures outlining the requirements, guidelines and detailed steps for escalation and security access controls to minimise the impact and interference to its physical environment. The organisation has defined and assigned roles and responsibilities for detecting, mitigating and responding against physical/environmental risks to ensure that employees understand their assigned tasks. The organisation has established and implemented policies and procedures outlining the requirements, guidelines and detailed steps to review physical security measures and assets to ensure that they remain secure.","cloud":"#","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented policies or processes to report physical/environmental risks and controls to the Board and/or senior management to ensure that they are kept informed of the risks. The organisation has established and implemented a process to review and improve the physical/environmental security measures to ensure that they are effective.","cloud":"#","ot":"#","ai":"#"}}},{"id":20,"name":"Network security","group":"Secure access & environment","desc":"This domain ensures that sufficient cybersecurity measures and/or processes to secure the confidentiality and accessibility oorganisation’s network and data are established.","essentials":false,"entryTier":"Practitioner","applicable":["Practitioner","Promoter","Performer","Advocate"],"req":{"Practitioner":{"classical":"The organisation has configured and implemented access controls, e.g., whitelisting, blacklisting, on its network to enforce network security policy and ensure that unauthorised users and/or devices are kept out. The organisation has established and implemented the use of stateful firewall over a basic packet-filtering firewall to ensure that packets are filtered with more context for greater effectiveness. The network architecture and devices have been reviewed regularly, at least annually, to ensure they are up-to-date, without obsolete rules and protocols.","cloud":"Examples include measures such as: –implementing runtime protection for containers or virtual machines, e.g., network segmentation for containers or virtual machines; and –using container firewalls or virtual firewalls to manage network traffic flow.","ot":"The organisation has implemented a firewall that is purpose-built for OT or tailored for the OT environment and supports common OT protocols to provide protection of the OT network between logical and/or physical segments, as well as OT networks that face the IT or internet environment.","ai":"#"},"Promoter":{"classical":"The organisation has defined and implemented a process to configure both wired and wireless networks securely, minimally using secure network authentication and encryption protocols and disabling Wi-Fi Protected Setup (WPS) to ensure that the network is secured and data is not lost or breached through the network. The organisation has defined and implemented a process to carry out network segmentation to segregate networks into private and public networks, with the private network holding business-critical data and having no connection to the internet to ensure that it is isolated from external threats.","cloud":"For securing the organisation's connection to the cloud or communications between cloud environments, the organisation has implemented secure communication channels with up-to-date and approved protocols, e.g., use of encryption, cloud VPNs.","ot":"In situations where securing OT communications and networks is not appropriate or recommended, e.g., has a negative impact on OT operations or safety, the organisation has implemented compensating controls. Examples include: –where secure network authentication and encryption protocol cannot be implemented, using media access control (MAC)address filtering or other measures; and –where legacy OT devices only support insecure wireless connections, using physical controls such as limiting wireless network coverage range within a secured physical area. The organisation has implemented segmentation (which can also include physical segmentation) to: –restrict and control communication and information flow between segments, based on the security requirements, risk and/or criticality; and –protect OT legacy systems that are insecure to provide isolation from threats propagating from other segments and/or the Internet.","ai":"As part of network segmentation, the organisation has implemented measures to manage the connectivity between its AI systems and other corporate systems, e.g., based on data sensitivity."},"Performer":{"classical":"The organisation has established and implemented security policies and procedures outlining the requirements, guidelines and detailed steps to harden the network architecture, device and access security. The organisation has defined and assigned roles and responsibilities to oversee, manage and monitor network security to ensure that employees understand their assigned tasks. The organisation has established and implemented network intrusion detection to monitor and detect malicious network traffic to ensure that it can be identified and addressed in a timely manner.","cloud":"To harden its cloud environment, the organisation has incorporated cloud security best practices. Examples include: –using cloud network security groups for granular security policies at the resource level; –using container application-aware network monitoring tools for: ▪automated determination of container networking surfaces, including both inbound ports and process-port bindings; ▪detection of traffic flows between containers and other network entities; ▪detection of network anomalies, e.g., unexpected traffic flows within the organisation’s network, port scanning, or outbound access to potentially dangerous destinations; and ▪detection of invalid or unexpected malicious processes and data introduced into the environment; and –using solutions such as cloud access security brokers (CASBs), or equivalent, leveraging frameworks such as secure access service edge (SASE) for network security in the cloud.","ot":"For network intrusion detection on OT networks, the organisation has established and implemented network intrusion detection solutions that are purpose-built or tailored for OT, i.e., network intrusion detection that has incorporated attack signatures for common various OT protocols, such as Modbus TCP, Distributed Network Protocol 3 (DNP3), and Inter- Control Center Communications Protocol (ICCP). When network intrusion detection solutions are not available for non-IP based protocols or controller-based operating systems in the OT environment, the organisation has considered compensating controls (e.g., anomaly detection systems).","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented the policies and processes to evaluate the performance of network security devices in terms of their effectiveness in blocking malicious traffic and implementing improvements. The organisation has established and implemented network intrusion prevention to block malicious network traffic and ensure that it is protected from threats.","cloud":"#","ot":"For network intrusion prevention on OT networks, the organisation has established and implemented network intrusion prevention solutions that are purpose-built or tailored for OT: In situations where automated responses associated with network intrusion prevention systems may impact the OT environment, e.g., false positives, the organisation has implemented appropriate mitigation measures such as placing the network intrusion prevention systems at higher levels, e.g., the demilitarised zone (DMZ) interfaces in the OT network.","ai":"#"}}},{"id":21,"name":"Incident response","group":"Cybersecurity resilience","desc":"This domain ensures that the organisation has formalised an incident response plan, with regular exercises conducted, to maintain the effectiveness of the current incident management set-up. This allows the organisation to detect, respond to and recover from cybersecurity incidents in a timely, professional and appropriate manner.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.9 Respond: Incident response\" to ensure it is ready to detect, respond to and recover from cybersecurity incidents.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.9 Respond: Incident response\" to ensure it is ready to detect, respond to and recover from cyber incidents.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has defined and applied measures to verify contact details and ensure that employees involved in the cybersecurity incident response plan are contactable to ensure a prompt response. Functional groups that are typically involved include: –senior management; –incident response and/or cybersecurity team; –legal team; and –communications team. The organisation has defined and applied the process to perform cyber exercises to ensure that stakeholders are involved and know what to do when an incident occurs to ensure that they are well prepared.","cloud":"For cloud incident management, other functional groups, such as the cloud development team, may also be involved. The organisation has included cloud-specific scenarios in these cyber exercises.","ot":"For OT incident management, other functional groups may also be involved: –IT personnelthat are involved in OT operations; –OT personnel; and –security personnel and safety personnel. The organisation has included OT-specific scenarios in these cyber exercises. In situations where there is heavy reliance or intersections between the OT customer and the OT supply chain, e.g. OT vendors, these exercises have included key external stakeholders in the OT supply chain.","ai":"For AI incident management, other functional groups, such as the AI development team, may also be involved. The organisation has included AI-specific scenarios in these cyber exercises."},"Performer":{"classical":"The organisation has defined and applied a process to carry out post-incident reviews of cyber exercises or cybersecurity incidents to identify areas for improvement and ensure that the incident response plan and process can be strengthened. The organisation has defined and established policies and procedures outlining the requirements, guidelines and detailed steps to investigate incidents to gather evidence to ensure that the root cause can be identified.","cloud":"Examples include: –using alerts from CSPM, SIEM, workload protection and network security monitoring; and –using cloud forensics to analyse the management plane, service and other logs and system forensics for containers and virtual machines.","ot":"The organisation has integrated its OT-specific incident response with the organisational incident response plan. The policies and procedures established have included an evaluation of the response actions required and their impact on OT operations, e.g., physical isolation of the compromised system may negatively impact OT operations and may result in disruption of operational performance or safety.","ai":"The organisation has integrated its AI-specific incident response with the organisational incident response plan."},"Advocate":{"classical":"The organisation has established and incorporated cybersecurity-related incidents into its crisis management plan to respond to incidents of higher magnitude and impact to ensure that they are treated with the appropriate urgency. The organisation has established and implemented a policy and process to report cybersecurity incidents and conclude the findings to the Board and/or senior management to ensure that they are kept informed.","cloud":"#","ot":"#","ai":"#"}},"essentialsRef":["A.9"]},{"id":22,"name":"Business continuity/Disaster recovery","group":"Cybersecurity resilience","desc":"This domain ensures that the organisation has identified critical assets and business processes so that recovery priorities can be establ continuity and disaster recovery management ensures that the organisation has developed and maintained capabilities employees, so that it is able to withstand disruptions and continue operations.","essentials":false,"entryTier":"Practitioner","applicable":["Practitioner","Promoter","Performer","Advocate"],"req":{"Practitioner":{"classical":"The organisation has identified the critical assets requiring high availability and implemented measures to ensure redundancies for them.","cloud":"#","ot":"The organisation has identified critical connectivity and assets required for reduced or constrained operations in the event of a cybersecurity incident. For OT components that are not readily available, the organisation has taken steps to ensure redundancies/ replacements are available.","ai":"#"},"Promoter":{"classical":"The organisation has defined and implemented a business impact analysis to identify critical processes and expected recovery time objectives (RTOs) and recovery point objectives (RPOs) for business resumption. The organisation has defined and implemented a process to perform redundancy on systems to ensure the cyber resilience of its systems.","cloud":"In the context of the cloud, this can include using cloud services that span multiple data centres and geographical regions for a single service to increase redundancy and resilience.","ot":"#","ai":"#"},"Performer":{"classical":"The organisation has established and implemented business continuity/disaster recovery policies outlining the requirements, roles and responsibilities and guidelines, including the RTO and RPO, to ensure that business resumption can be carried out according to the system’s criticality. The organisation has established and implemented a business continuity/disaster recovery plan to respond and recover from common business disruption scenarios, including those caused by cybersecurity incidents, to ensure cyber resilience. The organisation performs regular reviews, at least annually, of the business continuity/disaster recovery plan to ensure it is kept up-to- date. The organisation has established and implemented a policy and process to test its business continuity/disaster recovery plan regularly, at least annually, to ensure the effectiveness of the plan in achieving its objectives.","cloud":"The organisation has reviewed its CSPs’ disaster recovery plan for restoring cloud services, including the recovery of the organisation's applications and data in the cloud, to ensure alignment with its own disaster recovery plan.","ot":"When prioritising recovery activities, the organisation has factored in its risk assessment and developed an appropriate sequence for start-up activities of OT equipment that have operational dependencies. The organisation has determined the priority of recovery activities, e.g., recovering systems that support critical utilities before the OT systems. The organisation's business continuity/disaster recovery plan shall be documented in both electronic and paper form, and readily accessible. In situations where the testing the recovery plan is not feasible due to operational or safety considerations, the organisation has implemented alternative equivalents, such as laboratory testing or offline testing, to confirm the recovery procedures for OT equipment.","ai":"#"},"Advocate":{"classical":"The organisation monitors the RTO and RPO during business continuity/disaster recovery to ensure that they fall within targets and reports the findings to the Board and/or senior management. The organisation performs coordinated business continuity/disaster recovery exercises with its third parties for an extended period to evaluate the effectiveness of the processes and procedures.","cloud":"#","ot":"In situations where there is heavy reliance or intersections between the OT customer and the OT supply chain, e.g. OT vendors, these exercises have included key external stakeholders in the OT supply chain.","ai":"#"}}}];

/* ====== STATE ====== */
const LS = "ctm-tracker-v1";
let state = loadState();
function loadState(){
  try{const s=JSON.parse(localStorage.getItem(LS));if(s)return s;}catch(e){}
  return {org:"Our Organisation", target:0, done:{}, pillars:{cloud:false,ot:false,ai:false}};
}
function save(){localStorage.setItem(LS, JSON.stringify(state));}

function isChecked(d,tier){return !!(state.done[d.id] && state.done[d.id][tier]);}
function setChecked(d,tier,v){
  state.done[d.id] = state.done[d.id]||{};
  state.done[d.id][tier]=v; save();
}
/* tiers a domain requires up to & including target */
function reqTiersUpTo(d, targetTier){
  return TIERS.filter((t,i)=> d.req[t] && i<=targetTier);
}
function activePillars(){ return PILLARS.filter(p=>state.pillars && state.pillars[p.key]); }
/* domain status for target: 'todo'|'prog'|'done'|'na' */
function domainStatus(d, targetTier){
  if(!d.applicable.includes(TIERS[targetTier])) return "na";
  const need = reqTiersUpTo(d, targetTier);
  if(need.length===0) return "na";
  const got = need.filter(t=>isChecked(d,t)).length;
  if(got===0) return "todo";
  if(got===need.length) return "done";
  return "prog";
}

/* ====== RENDER — Variant A "The Credential" ====== */
const $ = s=>document.querySelector(s);
const SVG_CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="#FBFBF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 6.5"/></svg>`;
const SVG_CHECK_SM=`<svg viewBox="0 0 24 24" fill="none" stroke="#FBFBF8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 6.5"/></svg>`;

/* overall progress at current target */
function overall(){
  const tName=TIERS[state.target];
  const doms=DOMAINS.filter(d=>d.applicable.includes(tName));
  let need=0,got=0,met=0;
  doms.forEach(d=>{const ts=reqTiersUpTo(d,state.target);need+=ts.length;got+=ts.filter(x=>isChecked(d,x)).length;
    if(domainStatus(d,state.target)==="done")met++;});
  return {pct:need?Math.round(got/need*100):0,need,got,met,total:doms.length};
}

function buildStepper(){
  const el=$("#stepper");el.innerHTML="";
  TIERS.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="step";b.dataset.on=(i===state.target);
    // a tier is "done" if every domain applicable up to it is fully met for that target
    const doms=DOMAINS.filter(d=>d.applicable.includes(t));
    let need=0,got=0;doms.forEach(d=>{const ts=reqTiersUpTo(d,i);need+=ts.length;got+=ts.filter(x=>isChecked(d,x)).length;});
    b.dataset.done=(need>0&&got===need);
    b.innerHTML=`<span class="tick"></span><span class="n">${i+1}</span><span class="nm">${t}</span>`;
    b.addEventListener("click",()=>{state.target=i;save();render();});
    el.appendChild(b);
  });
}

function buildScope(){
  const el=$("#scope");el.innerHTML="";
  const base=document.createElement("div");
  base.className="pill locked";base.dataset.on="true";
  base.innerHTML=`<span class="d classical"></span>Classical<span class="st">always</span>`;
  el.appendChild(base);
  PILLARS.forEach(p=>{
    const on=!!(state.pillars&&state.pillars[p.key]);
    const b=document.createElement("button");
    b.className="pill";b.dataset.on=on;b.title=p.note;
    b.innerHTML=`<span class="d ${p.key}"></span>${p.label}<span class="st">${on?"in scope":"add"}</span>`;
    b.addEventListener("click",()=>{state.pillars=state.pillars||{};state.pillars[p.key]=!on;save();
      buildScope();if(openId!=null)renderSheet();});
    el.appendChild(b);
  });
}

function buildMeter(){
  const o=overall();
  const seg=$("#segbar");seg.innerHTML="";seg.classList.toggle("part",o.pct>0&&o.pct<100);
  const N=20,full=Math.round(o.pct/100*N);
  for(let i=0;i<N;i++){const i2=document.createElement("i");if(i<full)i2.className="full";seg.appendChild(i2);}
  $("#meterRead").textContent=`${o.pct}%`;
  $("#listCount").textContent=`${o.met}/${o.total} met`;
  // stamp
  const stamp=$("#stamp");stamp.classList.toggle("met",o.pct>=100);stamp.classList.toggle("part",o.pct>0&&o.pct<100);
  $("#stampPct").textContent=o.pct+"%";
  $("#stampLbl").textContent=o.pct>=100?"Ready":o.pct>0?"In progress":"Not started";
  $("#targetMeta").textContent=`${TIERS[state.target]} · ${o.total} domains`;
  // machine-readable zone
  const code=`CTM<<SGP<<${TIERS[state.target].toUpperCase()}<<${String(o.pct).padStart(3,"0")}PCT<<${o.met}OF${o.total}<<${(state.org||"ORG").toUpperCase().replace(/[^A-Z0-9]+/g,"<").slice(0,16)}`;
  $("#mrz").textContent=code;
}

function statusOf(d){return domainStatus(d,state.target);}

function buildList(){
  const sc=$("#scroll");sc.innerHTML="";
  const tName=TIERS[state.target];
  const groups=[...new Set(DOMAINS.map(d=>d.group))];
  groups.forEach(g=>{
    const lab=document.createElement("div");lab.className="glabel";lab.textContent=g;sc.appendChild(lab);
    DOMAINS.filter(d=>d.group===g).forEach(d=>{
      const st=statusOf(d);const na=st==="na";
      const row=document.createElement("button");
      row.className="row "+(st==="done"?"done":st==="prog"?"prog":st==="na"?"na":"");
      const dots=TIERS.map((t,i)=>{const on=d.applicable.includes(t);const cur=(i===state.target&&on);
        return `<i class="${on?"on":""}${cur?" cur":""}"></i>`;}).join("");
      const ts=reqTiersUpTo(d,state.target);const got=ts.filter(x=>isChecked(d,x)).length;
      const sub=na?`Not required · ${tName} tier`:`${got}/${ts.length} statement${ts.length===1?"":"s"} · entry ${d.entryTier}`;
      row.innerHTML=`
        <span class="rowtick">${SVG_CHECK_SM}</span>
        <span class="rid">${String(d.id).padStart(2,"0")}</span>
        <span class="rmid">
          <span class="rname">${d.name}${d.essentials?'<span class="ess">Ess</span>':""}</span>
          <span class="rsub">${sub}</span>
        </span>
        <span class="rdots">${dots}</span>`;
      row.addEventListener("click",()=>openSheet(d.id));
      sc.appendChild(row);
    });
  });
}

/* ===== bottom sheet ===== */
let openId=null;
function openSheet(id){openId=id;renderSheet();$("#scrim").classList.add("show");$("#sheet").classList.add("show");}
function closeSheet(){openId=null;$("#scrim").classList.remove("show");$("#sheet").classList.remove("show");}

let showFuture={};
function renderSheet(){
  const d=DOMAINS.find(x=>x.id==openId);if(!d)return;
  const targetTier=state.target;
  $("#sheetEyebrow").textContent=`Domain ${String(d.id).padStart(2,"0")} · ${d.group}`;
  $("#sheetTitle").innerHTML=`${d.name}${d.essentials?' <span class="ess" style="vertical-align:3px">Essentials</span>':""}`;
  const upto=reqTiersUpTo(d,targetTier);
  const future=TIERS.filter((t,i)=>d.req[t]&&i>targetTier);
  const showF=!!showFuture[d.id];
  const aps=PILLARS.filter(p=>state.pillars&&state.pillars[p.key]);

  const pillarNotes=(t)=>{
    if(!aps.length)return "";
    const cell=d.req[t]||{};
    return `<div class="pnotes">`+aps.map(p=>{
      const v=cell[p.key];
      if(v===undefined)return `<div class="pnote ${p.key} na"><span class="plab">${p.label}</span><span class="ptxt">No additional clause at this tier.</span></div>`;
      if(v==="#")return `<div class="pnote ${p.key} same"><span class="plab">${p.label}</span><span class="ptxt">Same as classical — applies as written above.</span></div>`;
      return `<div class="pnote ${p.key}"><span class="plab">${p.label}</span><span class="ptxt">${v}</span></div>`;
    }).join("")+`</div>`;
  };
  const essentialsBlock=(t)=>{
    if(!d.essentialsRef||!ESSENTIALS)return "";
    if(t!=="Supporter"&&t!=="Practitioner")return "";
    const kind=t==="Supporter"?"requirements":"recommendations";
    const label=t==="Supporter"?"Cyber Essentials requirements":"Cyber Essentials recommendations";
    const sections=d.essentialsRef.map(ref=>{
      const sec=ESSENTIALS[ref];if(!sec)return "";const clauses=sec[kind]||[];if(!clauses.length)return "";
      return `<div class="ess-sec"><div class="ess-sec-hd">${ref} ${sec.title}</div>
        ${clauses.map(c=>`<div class="ess-clause"><span class="eid">${c.id}</span><span>${c.text}</span></div>`).join("")}</div>`;
    }).join("");
    if(!sections)return "";
    return `<div class="ess-block"><div class="ess-hd">${label} · Cyber Essentials mark, Annex A</div>${sections}</div>`;
  };
  const rung=(t,isFuture)=>{
    const checked=!isFuture&&isChecked(d,t);
    return `<div class="rung ${checked?"checked":""} ${isFuture?"future":""}" data-tier="${t}" data-future="${isFuture}">
      <div class="rung-top">
        <div class="check">${SVG_CHECK}</div>
        <div class="rtier">${t}${isFuture?'<span class="fp">future</span>':""}</div>
      </div>
      <div class="rtext">${d.req[t].classical}</div>
      ${essentialsBlock(t)}${pillarNotes(t)}
    </div>`;
  };
  let ladder=upto.map(t=>rung(t,false)).join("");
  if(showF)ladder+=future.map(t=>rung(t,true)).join("");
  const got=upto.filter(t=>isChecked(d,t)).length;

  $("#sheetBody").innerHTML=`
    <div class="purpose">${d.desc}</div>
    <div class="ladder">${ladder||'<div class="purpose" style="opacity:.6">Not assessable at the '+TIERS[targetTier]+' tier.</div>'}</div>
    <div class="sheet-foot">
      <span class="prog">${got}/${upto.length} met · entry ${d.entryTier}</span>
      ${future.length?`<button class="allbtn" id="futureBtn">${showF?"Hide":"Preview"} future tiers</button>`:""}
    </div>
    <div class="src">Source: CSA Cyber Trust mark, 2nd ed. (04-2025), Annex B &amp; Table 7; Cyber Essentials mark (04-2025), Annex A.
    Requirement text summarises the classical-cybersecurity column — see the
    <a href="https://www.csa.gov.sg/cyber-trust" target="_blank" rel="noopener">official publication</a> for authoritative wording. Progress saved on this device only.</div>`;

  $("#sheetBody").querySelectorAll(".rung").forEach(r=>{
    if(r.dataset.future==="true")return;
    r.addEventListener("click",()=>{const t=r.dataset.tier;setChecked(d,t,!isChecked(d,t));
      renderSheet();buildList();buildMeter();buildStepper();});
  });
  const fb=$("#futureBtn");if(fb)fb.addEventListener("click",()=>{showFuture[d.id]=!showF;renderSheet();});
}

function render(){buildStepper();buildScope();buildMeter();buildList();}

/* ====== INIT ====== */
function init(){
  const org=$("#org");org.textContent=state.org||"Our Organisation";
  org.addEventListener("blur",()=>{state.org=org.textContent.trim()||"Our Organisation";org.textContent=state.org;save();buildMeter();});
  org.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();org.blur();}});
  $("#reset").addEventListener("click",()=>{if(confirm("Reset all tracked progress on this device?")){state.done={};save();render();if(openId!=null)renderSheet();}});
  $("#scrim").addEventListener("click",closeSheet);
  $("#sheetClose").addEventListener("click",closeSheet);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId!=null)closeSheet();});
  render();
}
init();
</script>
</body>
