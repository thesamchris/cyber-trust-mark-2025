<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cyber Trust mark — Credential</title>
<meta name="description" content="Your live CSA Cyber Trust mark credential — track preparedness across attainment tiers." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#ECEEE8;        /* cool document stock */
  --paper-2:#F4F5F1;
  --card:#FBFBF8;
  --ink:#1A2230;          /* official slate-navy */
  --ink-2:#33404f;
  --soft:#6A7686;
  --faint:#9AA3AE;
  --line:#D7DAD1;
  --line-2:#E5E7E0;
  --verified:#0F7A63;     /* credential teal-green = met */
  --verified-bg:#E1EFE9;
  --pending:#B27123;      /* ochre = in progress */
  --pending-bg:#F2E8D7;
  --stamp:#B0392F;        /* restrained official red */
  --tap:44px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  height:100dvh;overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
.kick{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);}

/* ===== shell: fixed chrome + one scroll region ===== */
.app{height:100dvh;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border-left:1px solid var(--line);border-right:1px solid var(--line);}
.chrome{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;border-bottom:1px solid var(--line-2);
  background:var(--card);}

/* identity row */
.id{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.id .org{font-weight:700;font-size:20px;line-height:1.05;letter-spacing:-.01em;color:var(--ink);
  outline:none;border-radius:5px;padding:1px 3px;margin:2px -3px 0;max-width:54vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.id .org:focus{background:var(--paper-2);box-shadow:0 0 0 1px var(--line);}
/* credential stamp = overall % */
.stamp{flex:0 0 auto;text-align:center;border:1.5px solid var(--line);border-radius:11px;
  padding:7px 11px 6px;min-width:78px;position:relative;background:var(--paper-2);transition:.3s;}
.stamp.met{border-color:var(--verified);background:var(--verified-bg);}
.stamp.part{border-color:var(--pending);background:var(--pending-bg);}
.stamp .pct{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;line-height:1;color:var(--ink);}
.stamp.met .pct{color:var(--verified);} .stamp.part .pct{color:var(--pending);}
.stamp .lbl{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:3px;}

/* target clearance stepper */
.block{margin-top:14px;}
.block-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 1px 7px;}
.block-hd .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);}
.stepper{display:flex;gap:5px;}
.step{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);
  padding:8px 4px 7px;text-align:center;transition:.2s;position:relative;}
.step .n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;color:var(--ink-2);line-height:1;}
.step .nm{display:none;font-size:9.5px;letter-spacing:.01em;color:var(--soft);margin-top:3px;line-height:1.1;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step[data-on="true"] .nm{display:block;}
.step[data-on="true"]{border-color:var(--ink);background:var(--ink);}
.step[data-on="true"] .n{color:var(--card);}
.step[data-on="true"] .nm{color:#C5CCD6;}
.step .tick{position:absolute;top:-5px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--verified);
  display:none;box-shadow:0 0 0 2px var(--card);}
.step[data-done="true"] .tick{display:block;}
.step:active{transform:scale(.97);}

/* scope pills */
.scope{display:flex;flex-wrap:wrap;gap:6px;}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12.5px;background:var(--paper-2);transition:.2s;color:var(--ink-2);}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--line);}
.pill.locked{opacity:.9;}
.pill .d.classical{background:var(--soft);}
.pill .d.cloud{background:#3E83C9;} .pill .d.ot{background:#C77B2E;} .pill .d.ai{background:#7C5FC9;}
.pill[data-on="true"]{border-color:var(--ink-2);background:var(--card);color:var(--ink);font-weight:500;}
.pill[data-on="false"] .d{background:var(--line);}
.pill .st{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
.pill:active{transform:scale(.96);}

/* credential meter */
.meter-row{margin-top:14px;display:flex;align-items:center;gap:12px;}
.segbar{flex:1;display:flex;gap:2px;height:11px;}
.segbar i{flex:1;background:var(--line-2);border-radius:2px;transition:background .35s, transform .35s;}
.segbar i.full{background:var(--verified);}
.segbar.part i.full{background:var(--pending);}
.meter-row .read{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);white-space:nowrap;}

/* ===== domain list (the scroll region) ===== */
.list-hd{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;
  padding:13px 18px 8px;}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px;}
.glabel{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding:14px 8px 6px;display:flex;gap:8px;align-items:center;}
.glabel::after{content:"";flex:1;height:1px;background:var(--line-2);}
.glabel:first-child{padding-top:2px;}

.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 10px;
  border-radius:10px;transition:background .15s;}
.row:active{background:var(--paper-2);}
.row.na{opacity:.4;}
.rowtick{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  background:var(--paper-2);display:grid;place-items:center;}
.rowtick svg{width:12px;height:12px;opacity:0;}
.row.done .rowtick{background:var(--verified);border-color:var(--verified);}
.row.done .rowtick svg{opacity:1;}
.row.prog .rowtick{border-color:var(--pending);background:var(--pending-bg);}
.row.prog .rowtick::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--pending);}
.rid{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);flex:0 0 auto;width:20px;}
.rmid{flex:1;min-width:0;}
.rname{display:block;font-weight:500;font-size:14.5px;line-height:1.2;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rname .ess{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--pending);border:1px solid var(--pending);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px;}
.rsub{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soft);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row.na .rsub{color:var(--faint);}
.rdots{display:flex;gap:3px;flex:0 0 auto;}
.rdots i{width:5px;height:5px;border-radius:50%;background:var(--line);}
.rdots i.on{background:var(--faint);} .rdots i.cur{background:var(--ink);transform:scale(1.3);}

/* machine-readable footer strip */
.mrz{flex:0 0 auto;border-top:1px solid var(--line);background:var(--paper-2);
  padding:7px 18px calc(env(safe-area-inset-bottom) + 7px);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;color:var(--soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:12px;}
.mrz button{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--stamp);flex:0 0 auto;}

/* ===== bottom sheet (progressive disclosure) ===== */
.scrim{position:fixed;inset:0;background:rgba(20,26,38,.34);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:40;backdrop-filter:blur(1.5px);}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;
  transform:translate(-50%,100%);background:var(--card);z-index:50;
  border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(20,26,38,.22);
  max-height:92dvh;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.2,.8,.2,1);}
.sheet.show{transform:translate(-50%,0);}
.sheet-hd{flex:0 0 auto;padding:10px 18px 12px;border-bottom:1px solid var(--line-2);position:relative;}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px;}
.sheet-hd .top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;}
.sheet-hd .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.sheet-hd h2{margin:3px 0 0;font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;}
.sheet-hd h2 .ess{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--pending);border:1px solid var(--pending);border-radius:4px;padding:1px 5px;}
.sheet-hd .x{flex:0 0 auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--soft);}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(env(safe-area-inset-bottom) + 20px);}
.purpose{font-size:13.5px;line-height:1.55;color:var(--ink-2);}

.ladder{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.rung{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--paper-2);transition:.2s;}
.rung.future{opacity:.6;background:var(--card);border-style:dashed;}
.rung-top{display:flex;align-items:center;gap:11px;}
.check{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);
  background:var(--card);display:grid;place-items:center;transition:.2s;}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.2s;}
.rung.checked .check{background:var(--verified);border-color:var(--verified);}
.rung.checked .check svg{opacity:1;transform:scale(1);}
.rtier{flex:1;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;color:var(--verified);display:flex;align-items:center;gap:8px;}
.rung.future .rtier{color:var(--soft);}
.rtier .fp{font-size:8px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--faint);letter-spacing:.08em;}
.rtext{font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:9px;}
.rung.checked .rtext{color:var(--soft);}

.ess-block{margin-top:11px;padding:11px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line-2);}
.ess-hd{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--pending);margin-bottom:8px;}
.ess-sec{margin-bottom:9px;} .ess-sec:last-child{margin-bottom:0;}
.ess-sec-hd{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;}
.ess-clause{display:flex;gap:8px;font-size:12px;line-height:1.45;color:var(--soft);margin-bottom:5px;}
.ess-clause:last-child{margin-bottom:0;}
.ess-clause .eid{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--faint);flex:0 0 auto;margin-top:2px;}

.pnotes{margin-top:11px;display:flex;flex-direction:column;gap:7px;}
.pnote{display:flex;gap:9px;font-size:12px;line-height:1.45;padding-left:10px;border-left:2px solid var(--line);}
.pnote .plab{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto;min-width:32px;margin-top:2px;}
.pnote .ptxt{color:var(--soft);}
.pnote.cloud{border-color:#3E83C9;} .pnote.cloud .plab{color:#3E83C9;}
.pnote.ot{border-color:#C77B2E;} .pnote.ot .plab{color:#C77B2E;}
.pnote.ai{border-color:#7C5FC9;} .pnote.ai .plab{color:#7C5FC9;}
.pnote.same .ptxt,.pnote.na .ptxt{color:var(--faint);font-style:italic;}

.sheet-foot{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:13px;border-top:1px solid var(--line-2);}
.sheet-foot .prog{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soft);}
.allbtn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--paper-2);}
.allbtn:active{transform:scale(.96);}
.src{margin-top:16px;font-size:11px;line-height:1.55;color:var(--faint);}
.src a{color:var(--soft);}

:focus-visible{outline:2px solid var(--verified);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
@media (max-width:380px){ .id .org{max-width:46vw;} }
</style>
</head>
<body>
<div class="app">
  <div class="chrome">
    <div class="id">
      <div>
        <div class="kick">CSA · Cyber Trust mark · Credential</div>
        <div class="org" id="org" contenteditable="true" spellcheck="false">Our Organisation</div>
      </div>
      <div class="stamp" id="stamp">
        <div class="pct" id="stampPct">0%</div>
        <div class="lbl" id="stampLbl">Not started</div>
      </div>
    </div>

    <div class="block">
      <div class="block-hd"><span class="kick">Target clearance</span><span class="meta" id="targetMeta"></span></div>
      <div class="stepper" id="stepper"></div>
    </div>

    <div class="block">
      <div class="block-hd"><span class="kick">Certification scope</span></div>
      <div class="scope" id="scope"></div>
    </div>

    <div class="meter-row">
      <div class="segbar" id="segbar"></div>
      <div class="read" id="meterRead">0 / 0</div>
    </div>
  </div>

  <div class="list-hd"><span class="kick">Domains at target</span><span class="kick" id="listCount"></span></div>
  <div class="scroll" id="scroll"></div>

  <div class="mrz">
    <span id="mrz">CTM&lt;&lt;SGP&lt;&lt;READY</span>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Domain detail">
  <div class="sheet-hd">
    <div class="grab"></div>
    <div class="top">
      <div>
        <div class="eyebrow" id="sheetEyebrow"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="x" id="sheetClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
const TIERS = ["Supporter","Practitioner","Promoter","Performer","Advocate"];
const TIER_DESC = {
  Supporter:"Small / micro & digital-native startups; starter digital maturity.",
  Practitioner:"Small & some medium organisations; starter digital maturity.",
  Promoter:"Medium & some large organisations; literate digital maturity.",
  Performer:"Large & some medium organisations; performer digital maturity.",
  Advocate:"Large or regulated-sector organisations; leading digital maturity."
};
const PILLARS = [
  {key:"cloud", label:"Cloud", full:"Cloud security",
   note:"Cloud services (IaaS / PaaS / SaaS) in scope."},
  {key:"ot", label:"OT", full:"OT security",
   note:"Operational technology — systems that monitor or control physical equipment & industrial processes."},
  {key:"ai", label:"AI", full:"AI security",
   note:"AI systems used within the organisation in scope."}
];
const ESSENTIALS = {
  "A.1": {
    "title": "Assets: People",
    "requirements": [
      {
        "id": "A.1.4 (a)",
        "text": "The organisation shall establish cybersecurity awareness and data protection training for all employees to ensure they are aware of the security practices and behaviour expected of them. Organisations may achieve this through various means, e.g., provide self-learning materials for employees or engaging external training providers."
      },
      {
        "id": "A.1.4 (b)",
        "text": "Cyber hygiene practices and guidelines shall be developed for employees to adopt in their daily operations."
      }
    ],
    "recommendations": [
      {
        "id": "A.1.4 (c)",
        "text": "Cyber hygiene practices and guidelines should include measures to mitigate cybersecurity incidents arising from human factors, as follows: – Be vigilant against the rise of AI-enabled social engineering and deepfake attacks; – Secure access with Multi-Factor Authentication (MFA) and strong passphrases and protect them; – Protect corporate and/or personal devices used for work, i.e., BYOD; – Handle and disclose business-critical data, including personal data with care; – Maintain secure work practices both on-site and remotely; and – Report all cybersecurity incidents promptly."
      },
      {
        "id": "A.1.4 (d)",
        "text": "Where feasible, the training content should be differentiated based on employee roles as follows: – Senior management or business leaders – Developing a cybersecurity culture/mindset within the organisation or establishing a cybersecurity strategy or workplan; – Employees – The use of strong passphrases, the protection of corporate and/or personal devices used for work; and – Employees handling personal data – Ensure familiarity with topics on personal data protection, NOTE – In Singapore, the Personal Data Protection Commission offers e-learning programme for handling personal data."
      },
      {
        "id": "A.1.4 (e)",
        "text": "As a best practice, such cybersecurity awareness initiatives should be conducted at least annually to refresh employee awareness."
      }
    ]
  },
  "A.2": {
    "title": "Assets: Hardware and software",
    "requirements": [
      {
        "id": "A.2.4 (a)",
        "text": "The organisation shall maintain an up-to-date asset inventory of all the hardware and software assets, including those from third-party vendors. Methods for maintaining this inventory may include the use of spreadsheets or IT asset management software to maintain the IT asset inventory. Organisations shall also include network diagrams and drawings of their environment."
      },
      {
        "id": "A.2.4 (f)",
        "text": "Unauthorised hardware and software assets, or those that have reached their respective EOS dates shall be removed."
      },
      {
        "id": "A.2.4 (g)",
        "text": "In cases where continued use of EOS assets is necessary, the organisation shall assess and understand the cybersecurity risk, obtain approval from senior management and monitor it until the asset is replaced."
      },
      {
        "id": "A.2.4 (h)",
        "text": "An authorisation process shall be developed for onboarding new hardware and software into the organisation. Methods may include email approval from senior management, ensuring that new hardware or software originate from official or trusted sources, and performing malware scans to verify the asset’s integrity. Asset whitelisting/blacklisting may also be implemented."
      },
      {
        "id": "A.2.4 (i)",
        "text": "The date of authorisation for software and hardware shall be included in the asset inventory list after obtaining the relevant approval, e.g., through email or with an approval form."
      },
      {
        "id": "A.2.4 (j)",
        "text": "Software and hardware without approval shall not be used in the organisation."
      },
      {
        "id": "A.2.4 (k)",
        "text": "Before disposing of any hardware asset, the organisation shall ensure that all critical or confidential information is securely wiped, sanitised, or otherwise destroyed, e.g., encrypting hard disk before reformatting and overwriting it."
      }
    ],
    "recommendations": [
      {
        "id": "A.2.4 (b)",
        "text": "Hardware assets within the scope of certification may include servers, network devices, laptops and computers. If the scope of the certification includes hardware assets such as mobile devices and/or IoT devices, note the following: Mobile – Organisations should include devices company-issued mobile devices as part of its asset inventory, such as mobile phones or tablets. IoT – The inventory should include devices IoT devices used within the organisation such as closed- circuit television (CCTV) cameras, smart printers and smart televisions."
      },
      {
        "id": "A.2.4 (c)",
        "text": "The inventory list should contain details of the hardware assets, where available, as follows: – Hardware name/model; – Asset tag/serial number; – Organisations should include company-issued mobile devices as part of its asset inventory, such as mobile phones or tablets. – The inventory should include IoT devices used within the organisation such as closed- circuit television (CCTV) cameras, smart printers and smart televisions. – Asset type; – Warranty information; – Asset location; – Network address; – Asset owner; – Asset classification; – Department; – Approval/authorisation date; – Service Level Agreements (SLAs); – End of support (EOS) date; and – Vendor contact information."
      },
      {
        "id": "A.2.4 (d)",
        "text": "The inventory list should contain details of the software assets, where available, as follows: – Software name; – Software publisher; – Software license key (including API keys); – Software version; – Business purpose; – Asset classification; – Approval/authorisation date; – SLAs; – EOS date; and – Vendor contact information."
      },
      {
        "id": "A.2.4 (e)",
        "text": "As a best practice, the hardware and software asset inventory list should be reviewed at least bi-annually (twice per year)."
      },
      {
        "id": "A.2.4 (l)",
        "text": "When disposing of hardware assets, the organisation should implement secure disposal methods, e.g., destroying the hard disks physically or engage disk shredding services."
      }
    ]
  },
  "A.3": {
    "title": "Assets: Data",
    "requirements": [
      {
        "id": "A.3.4 (a)",
        "text": "The organisation shall identify and maintain an inventory of business-critical data. Methods may include using spreadsheets or asset inventory software. The inventory list shall contain details of the data as follows: – Description; – Data classification and/or sensitivity; – Location; and – Retention period. For organisations holding substantive personal data that can result in a breach of a significant scale, the organisation shall also document the data flow diagram for personal data."
      },
      {
        "id": "A.3.4 (c)",
        "text": "The organisation shall establish a process to protect its business-critical data, e.g., password- protecting documents, encrypting emails, protecting organisational data on employee personal devices used for work (i.e., BYOD), which include personal laptops, mobile devices, and USB devices. For organisations holding substantive personal data that can result in a breach of a significant scale, the data shall be encrypted both at rest and in transit."
      },
      {
        "id": "A.3.4 (d)",
        "text": "Measures shall be implemented to prevent employees, third parties and contractors from disclosing or leaking confidential and/or sensitive data outside the organisation. Examples include: – disabling USB ports; and/or – including clauses regarding unauthorised disclosure of information in employment contracts and contractual agreements with third parties or contractors."
      },
      {
        "id": "A.3.4 (e)",
        "text": "Before disposing of any physical media containing confidential and/or sensitive data, e.g., paper, the organisation shall ensure that the data is securely destroyed, such as by shredding the media."
      }
    ],
    "recommendations": [
      {
        "id": "A.3.4 (b)",
        "text": "The inventory list should be reviewed at least annually, or whenever there are changes to the data captured by the organisation."
      }
    ]
  },
  "A.4": {
    "title": "Secure/Protect: Virus and malware protection",
    "requirements": [
      {
        "id": "A.4.4 (a)",
        "text": "Virus and malware protection solutions shall be used and installed on endpoints (e.g., laptop computers, desktop computers, servers, virtual environments) to detect attacks."
      },
      {
        "id": "A.4.4 (b)",
        "text": "Virus and malware protection solutions shall be configured to automatically scan files upon access to detect potential cyberattacks. This includes files and attachments downloaded from the internet through web browsers or email, and external sources such as from portable USB drives. Where feasible, scans should always remain active to provide constant protection."
      },
      {
        "id": "A.4.4 (c)",
        "text": "Automatic updates or configurations for virus and malware protection solutions shall be enabled to update signature files or equivalent (e.g., non-signature-based machine learning solutions) to detect new malware. At least daily updates are recommended for optimal protection."
      },
      {
        "id": "A.4.4 (e)",
        "text": "Firewalls shall be configured and deployed to protect the network, systems, and endpoints such as laptops, desktops, servers, and virtual environments. Depending on the organisation’s network setup, the firewall functionality may be integrated with other networking devices or deployed as a standalone device. In an organisation that has a network setup, a network perimeter firewall (e.g., Domain Name System (DNS) firewall and application-level gateway firewall) shall be configured to analyse and accept only authorised network traffic and deployed. In an organisation that comprises of just endpoints connecting to the internet and/or cloud-based applications, similarly, firewalls (e.g., software firewall (host-based firewall) built- in/included in operating systems, firewall integrated with the organisation's router or wireless access point) shall be configured and deployed."
      },
      {
        "id": "A.4.4 (h)",
        "text": "The organisation shall ensure employees install and use only authorised software, and access only attachments from official or trusted sources to ensure the integrity of the software, e.g., code signing."
      },
      {
        "id": "A.4.4 (i)",
        "text": "The organisation shall ensure employees use only trusted network connections for accessing the organisation’s data or business email, e.g., mobile hotspot, personal Wi-Fi, corporate Wi-Fi and virtual private network (VPN)."
      },
      {
        "id": "A.4.4 (j)",
        "text": "The organisation shall ensure employees immediately report any suspicious email or attachment to the IT team and/or senior management."
      }
    ],
    "recommendations": [
      {
        "id": "A.4.4 (b)",
        "text": "Virus and malware protection solutions shall be configured to automatically scan files upon access to detect potential cyberattacks. This includes files and attachments downloaded from the internet through web browsers or email, and external sources such as from portable USB drives. Where feasible, scans should always remain active to provide constant protection."
      },
      {
        "id": "A.4.4 (d)",
        "text": "If the scope of certification includes mobile devices, IoT devices, or web browser/email use: Mobile devices – Virus and malware protection solutions should be installed and running on mobile devices. IoT devices – Virus and malware protection solutions should be integrated with IoT devices, e.g., CCTVs, smart televisions, smart printers, digital door locks. Web browsers/email – Only fully supported web browsers and email client software with security controls should be used; anti-phishing and spam filtering tools should be implemented; unnecessary plug-ins/extensions/add-ons should be disabled and/or removed; web filtering should be deployed where feasible; and email authentication protocols such as SPF, DKIM and DMARC should be implemented."
      },
      {
        "id": "A.4.4 (f)",
        "text": "As good practice, firewall configurations and rules should be reviewed and verified annually to protect internet-facing assets where applicable."
      },
      {
        "id": "A.4.4 (g)",
        "text": "If the scope of certification includes mobile and/or IoT devices: Mobile devices – Firewalls should be installed and enabled on employees' mobile devices. IoT devices – Firewalls should be configured and enabled on IoT devices where possible."
      }
    ]
  },
  "A.5": {
    "title": "Secure/Protect: Access control",
    "requirements": [
      {
        "id": "A.5.4 (a)",
        "text": "Account management shall be established to maintain and manage the inventory of accounts. Methods may include spreadsheets or exporting lists from software directory services."
      },
      {
        "id": "A.5.4 (b)",
        "text": "The account inventory list shall include details for user, administrator, third-party and service accounts, not limited to the following: – Name; – Username; – Department; – Role/account type; – Date of access created; and – Last logon date."
      },
      {
        "id": "A.5.4 (c)",
        "text": "The organisation shall implement an approval process (e.g., email approval or access request form) to grant and revoke access. This shall be implemented when there are personnel changes such as new hires or role changes. The following fields shall be captured: – Name; – System to access; – Department; – Role/account type; – From date; and – To date."
      },
      {
        "id": "A.5.4 (d)",
        "text": "Access shall be managed to ensure employees can access only the information and systems required for their job role."
      },
      {
        "id": "A.5.4 (e)",
        "text": "Accounts with unnecessary or expired access rights shall be disabled or removed from the system. Shared, duplicate, obsolete, dormant and inactive accounts (e.g., inactive for more than 60 days) shall be removed."
      },
      {
        "id": "A.5.4 (f)",
        "text": "The administrator account shall only be created with approval from senior management and be used for administrator functions. The administrator account shall not be used for daily activities."
      },
      {
        "id": "A.5.4 (g)",
        "text": "Access shall be managed to ensure third parties or contractors can access only the information and systems required for their job role. Such access shall be removed when no longer needed."
      },
      {
        "id": "A.5.4 (h)",
        "text": "Third parties or contractors working with sensitive information shall sign a non-disclosure agreement outlining contractual actions for non- compliance."
      },
      {
        "id": "A.5.4 (j)",
        "text": "Physical access control shall be enforced to secure the organisation’s information assets and/or environment, allowing access only to authorised employees/contractors, e.g., use of cable locks for workstations, card access door locks to authenticate and authorise entry."
      },
      {
        "id": "A.5.4 (l)",
        "text": "The organisation shall change all default passwords and replace them with a strong passphrase (it should be at least twelve characters, including upper case, lower case and/or special characters)."
      },
      {
        "id": "A.5.4 (m)",
        "text": "User accounts shall be disabled and/or locked out after multiple failed login attempts, e.g., ten failed login attempts, rate-limiting attempts11."
      },
      {
        "id": "A.5.4 (n)",
        "text": "The account password shall be changed in the event of any suspected compromise."
      },
      {
        "id": "A.5.4 (o)",
        "text": "MFA shall be used for administrative access to important systems and database servers containing sensitive or business-critical data, or a substantive amount of personal data that can result in a breach of a significant scale. MFA methods include authenticator applications and one-time password (OTP) tokens."
      }
    ],
    "recommendations": [
      {
        "id": "A.5.4 (i)",
        "text": "The organisation should implement minimum cybersecurity requirements for third parties or contractors working with confidential and/or sensitive data and ensure its third parties or contractors inform the organisation of any relevant cybersecurity incidents involving these third parties or contractors. NOTE – In Singapore, Cyber Essentials is one of the certifications that help organisations implement fundamental cybersecurity measures."
      },
      {
        "id": "A.5.4 (k)",
        "text": "As good practice, account reviews should be carried out at least quarterly or whenever there are changes to the account list, e.g., during onboarding and offboarding processes or organisation restructuring."
      },
      {
        "id": "A.5.4 (l)",
        "text": "The organisation shall change all default passwords and replace them with a strong passphrase (it should be at least twelve characters, including upper case, lower case and/or special characters)."
      },
      {
        "id": "A.5.4 (p)",
        "text": "Where feasible, the organisation should implement additional measures to assist employees with secure passphrase management, e.g. trusted software to manage passphrases such as passphrase or password managers, passwordless authentication."
      }
    ]
  },
  "A.6": {
    "title": "Secure/Protect: Secure configuration",
    "requirements": [
      {
        "id": "A.6.4 (a)",
        "text": "Security configurations shall be enforced for the assets including desktop computers, servers and routers. Methods may include adopting industry recommendations and standards, running baseline security analysers and securing the system configuration, e.g. using scripts."
      },
      {
        "id": "A.6.4 (b)",
        "text": "Insecure configurations and weak protocols shall be replaced or upgraded to address the associated vulnerabilities, e.g., – using hypertext transfer protocol secure (HTTPS) instead of hypertext transfer protocol (HTTP) to encrypt data communication; – upgrading Wired Equivalent Privacy (WEP) to Wi-Fi Protected Access 2/3 (WPA2/WPA3) to enhance Wi-Fi security standards; and – disabling Server Message Block version 1 (SMBv1), as it has been superseded by more secured versions."
      },
      {
        "id": "A.6.4 (c)",
        "text": "Unused features, services, or applications shall be disabled or removed, e.g., disable file sharing services, File Transfer Protocol (FTP) service and restrict software macros."
      },
      {
        "id": "A.6.4 (d)",
        "text": "The organisation shall ensure that third parties or contractors protect their own software, applications and environments used for service delivery to the organisation."
      },
      {
        "id": "A.6.4 (f)",
        "text": "Automatic connection to open networks and auto-run features of non-essential programs (other than backup or virus and malware protection solutions) shall be disabled."
      },
      {
        "id": "A.6.4 (g)",
        "text": "Logging shall be enabled for audit logs of events that can assist in detecting, understanding or recovering from an attack, e.g. user-level events such as user log-ins in file access."
      }
    ],
    "recommendations": [
      {
        "id": "A.6.4 (e)",
        "text": "The organisation should review the cybersecurity posture of third parties or contractors, or perform audits on contractors, so as to adequately manage supply chain risk. NOTE – In Singapore, Cyber Essentials and Cyber Trust are certifications that help organisations to implement cybersecurity."
      },
      {
        "id": "A.6.4 (h)",
        "text": "The organisation should enable other system logs, application logs, security tool logs and outbound proxy logs."
      },
      {
        "id": "A.6.4 (i)",
        "text": "As good practice, automatic lock/session log outs should be enabled after fifteen minutes of inactivity for the organisation’s assets. These include user sessions on laptops, servers, non- mobile devices, databases and administrator portals."
      },
      {
        "id": "A.6.4 (j)",
        "text": "If the scope of certification includes mobile devices and/or IoT devices: Mobile devices – Mobile devices should not be jail-broken or rooted; mobile device passcodes should be enabled; automatic mobile device locks should be activated after two minutes of inactivity; mobile applications should only be downloaded from official or trusted sources. IoT devices – The network hosting IoT devices should be segregated from the network hosting the organisation's assets and data; security features should be enabled on IoT devices, e.g., disabling device auto-discovery and Universal Plug and Play (UPnP)."
      }
    ]
  },
  "A.7": {
    "title": "Update: Software updates",
    "requirements": [
      {
        "id": "A.7.4 (a)",
        "text": "The organisation shall prioritise the implementation of critical or important updates for operating systems and applications (e.g., security patches), obtained from official or trusted sources (e.g., verified through hash or checksum), as soon as feasible."
      }
    ],
    "recommendations": [
      {
        "id": "A.7.4 (b)",
        "text": "The organisation should conduct compatibility tests on operating system and application updates before installation."
      },
      {
        "id": "A.7.4 (c)",
        "text": "The organisation should consider enabling automatic updates for critical operating system and application patches where feasible so that they can receive the latest updates, and the deployment can be staggered into stages, starting with a subset of the organisation’s assets."
      },
      {
        "id": "A.7.4 (d)",
        "text": "If the scope of certification includes mobile devices and/or IoT devices: Mobile devices – The organisation should ensure that updates and patches for mobile devices are only downloaded from trusted sources (e.g., the official application store from the manufacturer). IoT devices – The organisation should remove or replace any IoT devices (e.g., CCTVs, printers) that are not receiving any software patches or updates."
      }
    ]
  },
  "A.8": {
    "title": "Backup: Back up essential data",
    "requirements": [
      {
        "id": "A.8.4 (a)",
        "text": "The organisation shall identify and back up business-critical data and systems. This is guided by identifying the data and systems essential for business recovery in the event of a cybersecurity incident, as well as meeting contractual or regulatory requirements. Examples of business-critical systems include customer relationship management (CRM) and enterprise resource planning (ERP). Examples of business-critical data include financial data, business transactions and source code."
      },
      {
        "id": "A.8.4 (b)",
        "text": "For business-critical data and systems, backups shall be performed regularly, with the backup frequency aligned to business requirements and the organisation's data loss tolerance."
      },
      {
        "id": "A.8.4 (f)",
        "text": "All backups shall be protected from unauthorised access and restricted to authorised personnel only, e.g., password-protected storage media, tape storage at an alternative office location, encryption of backups. Backups should minimally be passphrase-protected."
      },
      {
        "id": "A.8.4 (g)",
        "text": "Backups shall be stored separately and isolated from the operating environment. Where feasible, backups should be stored offsite, e.g., password-protected USB flash drives, encrypted external hard disks, tape storage at an alternative office location."
      }
    ],
    "recommendations": [
      {
        "id": "A.8.4 (c)",
        "text": "For non-business-critical systems or non- essential information, backups should still be performed albeit at a lower frequency or on a long-term basis."
      },
      {
        "id": "A.8.4 (d)",
        "text": "The backup process should be automated where feasible."
      },
      {
        "id": "A.8.4 (e)",
        "text": "If the scope of certification includes hardware assets such as mobile devices and/or IoT devices: Mobile devices – Essential business information stored on mobile phones should be automatically backed up and transferred to a secondary mobile phone or secondary storage. IoT devices – IoT devices containing essential business information should be backed up manually where automatic backup is unavailable."
      },
      {
        "id": "A.8.4 (f)",
        "text": "All backups shall be protected from unauthorised access and restricted to authorised personnel only, e.g., password-protected storage media, tape storage at an alternative office location, encryption of backups. Backups should minimally be passphrase-protected."
      },
      {
        "id": "A.8.4 (g)",
        "text": "Backups shall be stored separately and isolated from the operating environment. Where feasible, backups should be stored offsite, e.g., password-protected USB flash drives, encrypted external hard disks, tape storage at an alternative office location."
      },
      {
        "id": "A.8.4 (h)",
        "text": "Frequent backups, e.g., daily or weekly, should be stored online to facilitate quick recovery, e.g., cloud backup storage."
      },
      {
        "id": "A.8.4 (i)",
        "text": "As good practice, backups should be tested at least bi-annually, or more frequently, to ensure effective restoration of business-critical data and systems."
      }
    ]
  },
  "A.9": {
    "title": "Respond: Incident response",
    "requirements": [
      {
        "id": "A.9.4 (a)",
        "text": "The organisation shall establish an up-to-date basic incident response plan to guide the organisation in responding to common cybersecurity and data incidents. Examples include ransomware, social engineering, data breach and distributed denial-of-service (DDoS) attacks. The plan shall contain details as follows: – Clear roles and responsibilities for key personnel involved in the incident response plan process; – Procedures for detecting, responding to and recovering from common cybersecurity threat scenarios; and – A communication plan and timeline for escalating and reporting the incident to internal and external stakeholders (e.g., regulators, customers, senior management). The organisation's incident response plan shall be documented in paper form or on an offline system that cannot be compromised during a cyber incident."
      },
      {
        "id": "A.9.4 (b)",
        "text": "The incident response plan shall be communicated to all employees with access to the organisation’s IT assets and/or environment."
      }
    ],
    "recommendations": [
      {
        "id": "A.9.4 (c)",
        "text": "The organisation should conduct post-incident reviews and incorporate learning points to strengthen and improve the incident response plan."
      },
      {
        "id": "A.9.4 (d)",
        "text": "As good practice, the incident response plan should be reviewed at least annually."
      }
    ]
  }

const DOMAINS = [{"id":1,"name":"Governance","group":"Cyber governance & oversight","desc":"This domain ensures senior management is involved in the organisation’s cybersecurity governance. This includes overseeing the development and implementation of a cybersecurity strategy and roadmap to define and track goals/objectives.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has established and implemented practices to develop the importance of cybersecurity within its business context and communicate this to all relevant stakeholders, such as employees, customers and partners.","cloud":"As part of these practices, the organisation has established and implemented the cloud shared responsibility model with the CSP, e.g., through its commercial agreement with the CSP to establish clear roles and responsibilities between the organisation and the CSP.","ot":"#","ai":"Such practices include establishing mechanisms for: –The organisation to provide necessary security information about its AI systems to users and other relevant stakeholders, e.g. acceptable use policy of the AI systems in the organisation; and –Employees and external parties to report AI security concerns of the AI systems in the organisation."},"Performer":{"classical":"The organisation has defined and allocated the roles and responsibilities to ensure that it is clear who is responsible (e.g. Chief Information Security Officer (CISO)) to oversee the cybersecurity program implementation and manage cybersecurity risks within the organisation. The Board and/or senior management have sufficient expertise in cybersecurity and are involved in approving and overseeing the implementation of cybersecurity strategy, policies and procedures,and risk management actions. The organisation has established cybersecurity goals/objectives that are reviewed and approved by the Board and/or senior management at least annually and implemented through policies and procedures.","cloud":"The Board and/or senior management should have sufficient expertise in cloud security to make appropriate business decisions that take into consideration the implications associated with the specific risks of cloud computing, e.g., cloud concentration risk.","ot":"To ensure OT security has the attention of senior leadership, the organisation has identified member(s) of senior management to oversee and be overall responsible for both IT and OT security. The Board and/or senior management should have sufficient expertise in OT security to make appropriate business decisions that take into consideration the implications associated with the specific risks associated with OT, e.g., continued deployment of legacy OT systems that may not adequately support cybersecurity.","ai":"The organisation has defined and allocated roles and responsibilities for AI security due to the multidisciplinary nature of AI, which can cut across various organisational functions, e.g. functions overseeing ethics, legal matters, and risk areas. The Board and/or senior management should have sufficient expertise in AI security to make appropriate business decisions that take into consideration the implications associated with the specific risks of AI, e.g., over-reliance on AI. This includes identifying and documenting the objectives to guide the secure use of AI system(s) and ensuring these system(s) are used according to the intended purposes."},"Advocate":{"classical":"The Board and/or senior management has established a dedicated cybersecurity committee/forum to discuss on cybersecurity initiatives and activities regularly, oversee and monitor cybersecurity risks to ensure compliance with organisational cybersecurity policies, procedures and regulatory requirements. The organisation has established and implemented practices to ensure the Board and/or senior management are regularly updated on cybersecurity matters and key topics and decisions with regard to implementation of programmes and initiatives based on the organisation’s cybersecurity risksare discussed and made promptly.","cloud":"The cybersecurity committee/forum has implemented measuresto stay updated on cloud security practices, e.g., participating in cloud special interest groups.","ot":"The cybersecurity committee/forum has implemented measuresto stay updated on OT security practices, e.g., participating in OT special interest groups.","ai":"The cybersecurity committee/forum has implemented measuresto stay updated on fast- evolving AI security practices and governance landscapes, e.g., participating in AI special interest groups."}}},{"id":2,"name":"Policies and procedures","group":"Cyber governance & oversight","desc":"This domain ensures that cybersecurity policies and standards are established, implemented and communicated effectively. This provides employees with clear guidance on secure practices to protect the organisation’s environment. Formalised policies and procedures also enable continuous review and update, monitoring for non-compliance and management involvement, to address the evolving cyber threat landscape.","essentials":false,"entryTier":"Promoter","applicable":["Promoter","Performer","Advocate"],"req":{"Promoter":{"classical":"The organisation has implemented practices to regularly communicate and update its employees on the cybersecurity processes, industry best practices and standards adopted to manage cybersecurity risks and measures to be taken to protect its information assets.","cloud":"#","ot":"The organisation has implemented cross-functional or cross-team communications in areas where OT and IT security operations converge, to bridge the gaps, as OT and IT teams in the organisation may be distinct and operate independently.","ai":"The organisation has implemented cross- functional or cross-team communications in areas where AI security intersects with other functional areas in the organisation, due to the multidisciplinary nature of AI."},"Performer":{"classical":"The organisation has established and implemented policies and procedures that incorporate the relevant requirements, guidance and directions to manage cybersecurity risk and protect information assets in its environment to ensure that employees have clear direction and guidance. The cybersecurity policies and procedures are approved and formalised by the Board and/or senior management to ensure top-down support. The cybersecurity policies and procedures are published, communicated and made accessible for employees to ensure that the employees have clear direction and guidance to perform their work securely.","cloud":"#","ot":"The organisation has established and implemented policies and procedures for the secure use of its OT environment and integrated these policies and procedures with its IT policies and procedures, whilst taking into consideration the differences between theOT and IT environment.","ai":"The organisation has established and implemented policies and procedures for the secure use of its AI system(s) in the organisation and integrated these policies and procedures with other organisational policies and procedures, e.g., enterprise and/or cybersecurity risk management."},"Advocate":{"classical":"The organisation performs regular review and reporting on the effectiveness and deviations of itscybersecurity policies and procedures to the Board and/or senior management at least annually to ensure that they are kept informed. The organisation has established and implemented the necessary measuresto ensure compliance with its cybersecurity policies and procedures. The organisation has established and implemented the necessary measuresto track and monitor non- compliance with policies, processes and procedures, and to address associated cybersecurity risks.","cloud":"#","ot":"#","ai":"This includes policies and processes to ensure the secure use of AI system(s) and in accordance to organisational policies, including defining and documenting the processes for the secure use of AI system(s)."}}},{"id":3,"name":"Risk management","group":"Cyber governance & oversight","desc":"This domain ensures the organisation has established risk management practices to identify, assess, mitigate, monitor and rep","essentials":false,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has identified the cybersecurity risks in the environment, including risks on-premises, and where applicable, remote risks, to ensure that all the identified cybersecurity risks can be addressed. The organisation performs steps to analyse and prioritise the critical cybersecurity risks in itsbusiness environment to ensure that the more critical cybersecurity risks are addressed first.","cloud":"The organisation has included cloud-specific risks, including: –howstoring data in the cloud (which may span multiple jurisdictions) can impact data sovereignty and privacy requirements on the organisation; and –supply chain risks, as cloud services are often built on a series ofCSPs.","ot":"The organisation has included OT-specific risks, including sector-specific risks based on incidents that have impacted its industry. In an OT environment, such critical cybersecurity risks can include impact on human safety and potential physical impact on OT system(s). The organisationhas put the priority on safety, systems reliability and physical assets.","ai":"The organisation has included AI-specific risks, including: –risk of data leakage arising from both malicious attacks and unintended data disclosure by employees; and –risk of compromise to the integrity of data and/or the AI model, resulting in unintended output from its AI system(s) and has included mechanisms to provide adequate human oversight over the organisation’s AI system(s)."},"Practitioner":{"classical":"The organisation has established and implemented a risk treatment plan with the guidelines and/or requirements to accept, remediate or mitigate the identified cybersecurity risks to ensure that cybersecurity risks are treated. The organisation performs regular cybersecurity risk identification at least on an annual basis or whenever there are changes to the environment and tracks them to maintain a record of the cybersecurity risks in the environment.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has defined and applied a cybersecurity risk assessment process to identify risk, assess the dependencies and evaluate the current measures in place to ensure that the organisation is clear on how to assess the cybersecurity risks. The organisation has established, implemented and maintained a cybersecurity risk register containing the risks identified with their priority, the treatment plan, timeline, the employee(s) assigned the task of tracking and monitoring.","cloud":"The organisation may use a standard risk register to track cloud services and deployments.","ot":"The risk register shall capture OT security risks that may not be mitigated due to the nature of the OT environment, e.g., insecure and/or outdated protocols, systems that are no longer supported, delays in updates due to maintenance schedules.","ai":"The organisation’s cybersecurity risk assessment for its AI systems has factored in and documented the resources utilised, e.g.: –data assets; –software assets; –systems and computing resources; and –employee use of AI to fully understand the risks and impact."},"Performer":{"classical":"The organisation has established and implemented risk management policies and procedures with the requirements, guidelines and detailed steps to identify, analyse, evaluate, monitor and treat cybersecurity risks. The organisation has defined and allocated roles and responsibilities for conducting and overseeing cybersecurity risk assessment to ensure that employees are clear on the tasks assigned to them. The organisation has established the cybersecurity risk appetite and cybersecurity risk tolerance statement approved by the Board and/or senior management to ensure that there is organisational consensus on the type and acceptable level of cybersecurity risk.","cloud":"Where there are major or significant cloud security risks that may not be mitigated, e.g., cloud concentration risks, the trade-offs and appropriate cyber resilience measures shall be reported to and approved by the Board and/or senior management.","ot":"Where there are major or significant OT security risks that may not be mitigated, e.g., continued deployment of legacy OT systems that may not adequately support cybersecurity, the trade-offs and appropriate use of compensation controls shall be reported and approved by the Board and/or senior management.","ai":"Where there are major or significant AI security risks that may not be mitigated, e.g., AI concentration risks, AI over-reliance, the trade-offs and appropriate mitigation measures shall be reported to and approved by the Board and/or senior management."},"Advocate":{"classical":"The organisation has established and implemented a cybersecurity risk management framework that is integrated as part of the organisation's overall risk management to ensure alignment with business goals. The organisation has established and implemented policy and process to report identified cybersecurity risks to the Board and/or senior management at least on a monthly basis to ensure that they are kept informed. The organisation has established and implemented policy and process to review deviations to ensure that the residual cybersecurity risk stays within its cybersecurity risk appetite and risk tolerance level.","cloud":"#","ot":"#","ai":"For the organisation implementing AI systems, its policies and processes to review deviations have included ways to monitor for data and model drift that may impact the ability of the model to meet intended outcomes, resulting in changes in AI risk exposure."}}},{"id":4,"name":"Cyber strategy","group":"Cyber governance & oversight","desc":"This domain ensures the organisation has established a cybersecurity strategy, supported by a detailed roadmap and workplan, to achieve planned targets and objectives within a specified timeframeand maintain organisation-widecyber resilience.","essentials":false,"entryTier":"Advocate","applicable":["Advocate"],"req":{"Advocate":{"classical":"The organisation has established a cybersecurity strategy to achieve cyber resiliency and protect the organisation against cybersecurity threats in terms of people, process and technology. The cybersecurity strategy has been translated into a roadmap to achieve planned targets over a time period. The organisation has established and implemented a cybersecurity workplan based on its cybersecurity strategy and roadmap, incorporating the necessary actions, timelines and allocated resources to achieve the planned targets. The organisation has allocated sufficient budget and funds to achieve the planned cybersecurity targets. The budgets and funds are monitored by the Board/senior management and revised on a regular basis based on updates received. The organisation has tracked and evaluated its progress on cybersecurity strategy, the roadmap and workplans regularly at least on an annual basis with its Board/senior management to ensure that they are updated on the progress and status. The organisation has reviewed and updated its cybersecurity strategy, roadmap and workplan at least annually to ensure alignment with business goals and objectives and to factor inthe evolving cyber threat landscape.","cloud":"The cybersecurity strategy has included: –business continuity and cyber resilience strategies which are developed based on the cloud service model(s) between the organisation and its CSPs; and –infrastructure design and decisions. The organisation has also factored inthe cloud threat landscape, where adversaries are targeting cloud services as more organisations implement cloud-based solutions.","ot":"The cybersecurity strategy and roadmap has taken into account: –cybersecurity goals for its OT systems, such as focusing on safety, reliability and the physical systems and processes; –the long lifecycle of OT assets;and –the organisation's operational model for OT, e.g., insource, outsource, and/or use of managed security services. The organisation has also factored inthe OT threat landscape, which is seeing increased adversarial interest in OT.","ai":"The cybersecurity strategy and roadmap has identified and documented the organisation’s objectives to guide the secure use of its AI system(s). The organisation has also factored in the AI threat landscape, as organisations increasingly adopt AI."}}},{"id":5,"name":"Compliance","group":"Cyber governance & oversight","desc":"This domain ensures the organisation is aware of applicable laws, regulations and guidelines related to cybersecurity, so that compliance can be achieved. A compliance policy with active identification of non-compliance allows the organisation to manage the associated risks.","essentials":false,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has identified the cybersecurity-related laws, regulations and/or guidelines (e.g., sector-specific) applicable in its area of business in order to comply with them.","cloud":"In identifying the relevant laws, regulations and/or guidelines, the organisation has considered how its cloud deployment, including the storage of data in the cloud, may span different legal and regulatory jurisdictions, and thesemay have their respective data privacy frameworks, or sector- specific frameworks, e.g., healthcare, financial sector.","ot":"In identifying the relevant laws, regulations and/or guidelines, the organisation has also considered the applicable safety laws, regulations and/or guidelines.","ai":"In identifying the relevant laws, regulations and/or guidelines, the organisation has factored in the emerging landscape of AI regulations in the countries it operates in."},"Practitioner":{"classical":"The organisation has established and implemented measures to ensure compliance with the applicable cybersecurity-related laws, regulations and/or guidelines, e.g., sector-specific.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has communicated cybersecurity- related laws, regulations and/or guidelines, (e.g., sector- specific) to employees to ensure that they are aware of them when performing their tasks. The organisation has defined and applied a process to ensure that they stay compliant and up to date with the latest cybersecurity-related laws, regulations and/or guidelines (e.g., sector-specific) applicable to the organisation.","cloud":"#","ot":"#","ai":"#"},"Performer":{"classical":"The organisation has established and implemented policy and procedureswith the necessary measures, requirements and steps to address cybersecurity-related laws, regulations and/or guidelines, (e.g., sector- specific). The organisation has defined and allocated roles and responsibilities to address the requirements in cybersecurity- related laws, regulatory compliance and/or guidelines (e.g., sector-specific) in the organisation to ensure that employees are clear of their tasks for compliance.","cloud":"#","ot":"#","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented a policy and process to ensure that the organisation’s processes and systems comply with applicable cybersecurity- related laws, regulatory compliance and/or guidelines (e.g., sector-specific) and to identify any non-compliance. The organisation has established and implemented the policy and procedure to take actionagainst non- compliance with cybersecurity- related laws, regulations and/or guidelines (e.g., sector- specific) to ensure that the organisation is able to stay compliant. Cybersecurity-related laws, regulatory compliance and/or guidelines (e.g., sector- specific) and non-compliance are reported to the Board and/or senior management on a timely basis to ensure that they are kept informed of the associated risks and potential areas of non-compliance.","cloud":"#","ot":"#","ai":"#"}}},{"id":6,"name":"Audit","group":"Cyber governance & oversight","desc":"This domain ensures the organisation has established an audit program to assess the effectiveness of policies, processes, pro cybersecurity risks.","essentials":false,"entryTier":"Performer","applicable":["Performer","Advocate"],"req":{"Performer":{"classical":"The organisation has established, implemented and maintained a cybersecurity audit plan, including at a minimum, the objective, scope, roles and responsibilities, guidelines, and frequency for auditing to assess the effectiveness of the organisation's policies, processes, procedures and controls against cybersecurity risks. The organisation has established an internal audit function and/or team to assess the policies, processes, procedures and controls against cybersecurity risks. The organisation has established and implemented policies, processes, procedures and controls to mitigate and address the audit findings based on priority and timelines to ensure that the audit findings are remediated promptly.","cloud":"#","ot":"The organisation has established and implemented appropriate compensating controls to mitigate and address the audit findings that ariseas a result of limitations in the OT environment, which prevent it from implementing adequate cybersecurity, e.g., constraints in using encryption due to potential time-sensitivity challenges, constraints in updating software to patch vulnerabilities promptlydue to potential disruption to OT operations.","ai":"#"},"Advocate":{"classical":"The organisation has implemented monitoring and review of the audit findings, at least quarterly to ensure that they are remediated within the stipulated timeline. The organisation has established and implemented processes to report and follow up on the findings with the Board and/or senior management to ensure that they are informed of the audit findings and critical risks.","cloud":"#","ot":"#","ai":"#"}}},{"id":7,"name":"Training and awareness","group":"Cyber education","desc":"This domain ensures the organisation has instilled cybersecurity awareness and culture among its employees, preventing them from becoming the weakest link in the organisation’s defences.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene, under \"A.1 Assets: People\", to ensure that employees are equipped with the security knowledge and awareness to identify and mitigate against cyber threats.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.1 Assets: People\" to ensure that employees are equipped with the security knowledge and awareness to identify and mitigate against cyber threats. The organisation takes measures to track the relevant metrics (e.g., attendance) to ensure that employees have completed the cybersecurity awareness and training programmes.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation takes measures to ensure that employees are assessed at the end of the awareness and training programmes,and are required to pass the programmes sothat they demonstrate what they have learnt. The organisation has appointed a cybersecurity champion to promote cybersecurity awareness and launch cybersecurity initiatives.","cloud":"#","ot":"#","ai":"#"},"Performer":{"classical":"The organisation has established and implemented policies and procedures on the training types, frequency and attendees’ requirements as well as the steps to conduct and participate in the training to ensure that they can be adhered to. The organisation has its cybersecurity awareness and training programmes endorsed by the Board and/or senior management to ensure that they are in place and up to date. The organisation has defined and established policies and processes to identify the cybersecurity skillsets necessary for its employees, including the Board and/or senior management, to manage cybersecurity risks and incidents, and to ensure that they receive the relevant training.","cloud":"#","ot":"The organisation has included cross-domain training of IT and OT teams to equip them with the skillsets to preparefor a converged IT/OT environment.","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented a process to evaluate the effectiveness of the cybersecurity awareness and training programmes, e.g., by monitoring the results of trainings, the number of related cybersecurity incidents before and after the training programmes. The organisation has established and implemented a process to conduct regular skill gap analysis to identify lacking cybersecurity skillsets. The organisation has a department (e.g., team within Human Resource (HR), business units) to be responsible for conducting, reviewing and ensuring the compliance of employees’ awareness and compliance with the training programmes.","cloud":"#","ot":"#","ai":"#"}},"essentialsRef":["A.1"]},{"id":8,"name":"Asset management","group":"Information asset protection","desc":"This domain ensures hardware and software assets within the organisation environment are identified and tracked, enabling theimplementation of cybersecurity measures and/or processes across the asset lifecycle. Active asset management allows the organisat assets within its environment, ensuring only authorised assets are used and installed.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under A.2 Assets: Hardware and software to ensure that hardware and software present in the environment are identified and protected against common cyber threats.","cloud":"#","ot":"#","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under A.2 Assets: Hardware and software to ensure that hardware and software present in the environment are identified and protected against common cyber threats.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has established and implemented policies and procedures on the security requirements, guidelines and detailed steps to classify, handle and dispose of hardware and software assets in the environment securely to ensure that employees have clear direction and guidance. The organisation has established and implemented a process to classify and handle hardware and software according to their confidentiality and/or sensitivity levels to ensure that they receive adequate security and protection. The organisation has defined and allocated roles and responsibilities to ensure that it is clear who is responsible to maintain, support and manage the hardware and software assets in the inventory list.","cloud":"For secure deletion and/or destruction of the organisation’s data that has been stored in the cloud, as cloud services may replicate data across multiple servers and locations, the organisation has reviewed the data deletion/destruction practices practised by its CSPs, (e.g., deletion of customer data through cryptographic erasure) to ensure such practices are in alignment with its organisational policies.","ot":"For OT, as the priority is on safety and availability, the organisation has established and implemented such classification and handling process to factor in safety and availability, e.g., security levels.","ai":"For classification and secure handling and deletion of the organisation’s data used for/in AI, the organisation has included its AI models and any training data used to train the AI models in its policies and procedures."},"Performer":{"classical":"The organisation has established and implemented asset discovery tools that are appropriate and recognised in the industry to scan and discover assets that are connected to its network to ensure that all the assets can be managed securely. The organisation has established and implemented an acceptable use policy on the rules and restrictions for hardware and software assets to ensure that the assets are being managed appropriately and securely.","cloud":"The asset discovery tool implemented by the organisation has the capability to track and manage the organisation's cloud-based assets, e.g., virtual machines, containers, storage buckets, databases.","ot":"The organisation has implemented asset discovery tools that are purpose-built or tailored for OT. –Where automated scanning tools are used, the organisation has considered using passive scanning tools that are not intrusive, as active scanning canhave negative impact on OT operations or safety; –Where the OT environment contains isolated systems, components, or systems connected on non-Internet Protocol (IP)networks, to complement asset discovery tools, the organisation has established and implemented manual processes to support asset discovery.","ai":"#"},"Advocate":{"classical":"The organisation has established and implemented policies and process to ensure that the hardware and software asset inventory is consistent and updated organisation- wide. The organisation has established and implemented the use of an asset inventory management system that is appropriate and recognised in the industry to track and manage hardware and software assets to ensure accuracy and avoid oversight. Asset risks are being addressed as part of the risk assessment framework and reported to the Board and/or senior management to ensure that they are not neglected.","cloud":"The organisation’s asset inventory management system has the capability to track and manage cloud assets.","ot":"The organisation’s asset inventory management system has the capability to track and manage OT assets.","ai":"The organisation’s asset inventory management system has the capability to track and manage AI tools, services and/or systems."}},"essentialsRef":["A.2"]},{"id":9,"name":"Data protection and privacy","group":"Information asset protection","desc":"This domain ensures that business-critical data within the organisation’s environment is identified and tracked, enabling the implementation of cybersecurity measures and/or processes across the asset lifecycle. It also ensures that data collection, processing, transf unauthorised access and/or disclosure.","essentials":true,"entryTier":"Supporter","applicable":["Supporter","Practitioner","Promoter","Performer","Advocate"],"req":{"Supporter":{"classical":"The organisation has implemented all the cybersecurity requirements in the mark of cyber hygiene under \"A.3 Assets: Data\" to ensure that business-critical data (including personal data, company secrets, intellectual property) can be identified, located and secured. The organisation has defined and applied a process to report any business-critical data (including personal data, company secrets, intellectual property) breach and to ensure that stakeholders such as the management, relevant authorities and relevant individuals are kept informed. The organisation using encryption has defined and applied a process on the use of recommended protocol and algorithm and minimum key length to ensure that itis secure and in alignment to industry best practices.","cloud":"#","ot":"In situations where encryption has beenimplemented and this results in latency that has negative impact on OT operations or safety, the organisation has established and implemented reasonable compensating controls.","ai":"#"},"Practitioner":{"classical":"The organisation has implemented all the cybersecurity recommendations in the mark of cyber hygiene under \"A.3 Assets: Data\" to ensure that business-critical data (including personal data, company secrets, intellectual property, etc) can be identified, located and secured.","cloud":"#","ot":"#","ai":"#"},"Promoter":{"classical":"The organisation has established and implemented policies and procedures to carry out risk classification and handle business-critical data (including personal data, company secrets, intellectual property, etc) according to their confidentiality and/or sensitivity levels to ensure that they receive adequate security and protection. The organisation has established and implemented policies and procedures to document the data flow diagram of business-critical data (including personal data, company secrets, intellectual property) through information systems and programs in the organisation and implement relevant enforcement measures to ensure that they stay within the environment. The organisation has established and implemented policies and procedures to handle business-critical data (including personal data, company secrets, intellectual property, etc) securely and to protect business-critical data according to their classifications and requirements (e.g., collect, use, protect, dispose).","cloud":"The organisation’s data flow diagram has included data that is processed and stored in the cloud, and the geographic location(s) of data in the cloud.","ot":"For OT, as the priority is on safety and availability, the organisation has established and implemented such classification and handling policies and procedures to also factor in safety and availability. Examples of OT data include controller configuration files, Programmable Logic Controller (PLC)program codes and computer-aided drafting/comput
